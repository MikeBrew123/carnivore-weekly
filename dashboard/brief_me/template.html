<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brief Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Visual language borrowed from the Live Site Pulse artifact: Plex Sans/Mono,
   per-site colours, delta pills, panels. Layout: status bar, stage, caption,
   ticker, controls. */
:root{
  --bg:#f3f4f2;--panel:#fff;--ink:#1b2321;--muted:#5d6a66;--line:#dde2df;--wash:#eef1ef;
  --cw:#b3401f;--kd:#0f7a73;--pd:#2f5fb3;--good:#1d7a45;--bad:#b3261e;--warn:#9a6a00;
  --k1:#0072b2;--k2:#c77e00;--k3:#00875f;--k4:#b8588c;--k7:#8a9490;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816;--panel:#1a2220;--ink:#e8eeec;--muted:#9aa8a3;--line:#2b3633;--wash:#222c29;
  --cw:#ef8a66;--kd:#4cc4b9;--pd:#7ea6ec;--good:#58c486;--bad:#f08a82;--warn:#e0b44a;
  --k1:#4aa3e0;--k2:#f0b840;--k3:#2fcf9e;--k4:#e59ac2;--k7:#8d9a95;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816;--panel:#1a2220;--ink:#e8eeec;--muted:#9aa8a3;--line:#2b3633;--wash:#222c29;
  --cw:#ef8a66;--kd:#4cc4b9;--pd:#7ea6ec;--good:#58c486;--bad:#f08a82;--warn:#e0b44a;
  --k1:#4aa3e0;--k2:#f0b840;--k3:#2fcf9e;--k4:#e59ac2;--k7:#8d9a95;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto auto 52px;height:100dvh}
button{font:500 13px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}button:focus-visible{outline:2px solid var(--k1);outline-offset:2px}

/* status bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);letter-spacing:.12em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.when{font:12px var(--mono);color:var(--muted)}
@media (max-width:600px){.when{display:none}}
.segs{flex:1;display:flex;gap:4px;min-width:80px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0;width:0;background:var(--ink)}

/* stage + slides */
.stage{position:relative;overflow:hidden;min-height:0}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(14px,3.5vw,44px) clamp(16px,5vw,64px);display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);
  opacity:0;pointer-events:none;clip-path:inset(0 0 0 100%);transition:opacity .35s,clip-path .55s cubic-bezier(.7,0,.2,1)}
.slide>:first-child{margin-top:auto}.slide>:last-child{margin-bottom:auto}
.slide.on{opacity:1;pointer-events:auto;clip-path:inset(0 0 0 0)}
.slide.off{clip-path:inset(0 100% 0 0);opacity:0}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:3px 10px;color:var(--acc)}
.site{display:inline-flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted)}
.site i{width:10px;height:10px;border-radius:2px;background:var(--acc)}
h1{margin:0;font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,min(4.4vw,6vh),54px);line-height:1.08;text-wrap:balance;max-width:24ch}
.body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(14px,3vw,36px);align-items:center}
.body.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:760px){.body{grid-template-columns:minmax(0,1fr)}}
.big{font:600 clamp(44px,min(10vw,13vh),120px)/.95 var(--mono);font-variant-numeric:tabular-nums;color:var(--acc);letter-spacing:-.03em}
.biglab{font-size:13px;color:var(--muted);margin-top:6px}
.delta{display:inline-block;margin-top:10px;font:600 13px var(--mono);border-radius:99px;padding:3px 10px;background:var(--wash)}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.delta.flat{color:var(--muted)}
ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
li{font-size:clamp(14px,1.7vw,18px);line-height:1.4;padding-left:16px;position:relative;opacity:0;transform:translateY(8px);transition:all .45s}
li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.slide.on li{opacity:1;transform:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel svg{display:block;width:100%;height:auto;max-height:44vh}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
@media (max-width:600px){svg text{font-size:15px}.panel{padding:10px}}
svg .strong{fill:var(--ink);font-weight:600}
svg .grid{stroke:var(--line)}svg .axis{stroke:var(--muted)}
.grow{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.growy{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.pop{transform-box:fill-box;transform-origin:center;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.slide.on .grow{transform:scaleX(1)}.slide.on .growy{transform:scaleY(1)}.slide.on .pop{transform:scale(1)}
.fade{opacity:0;transition:opacity .6s}.slide.on .fade{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.quote{font-size:clamp(18px,2.4vw,28px);line-height:1.35;font-weight:500;position:relative;padding-left:22px;border-left:4px solid var(--acc)}
.people{display:flex;flex-wrap:wrap;gap:10px}
.pp{display:inline-flex;flex-direction:column;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:18px;min-width:110px}
.pp.new{border-color:var(--acc);background:var(--wash)}
.pp em{font:600 11px var(--mono);color:var(--acc);font-style:normal;text-transform:uppercase;letter-spacing:.08em}
.pp small{font-size:12px;color:var(--muted);margin-top:4px}
.quote small{display:block;margin-top:10px;font:12px var(--mono);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}

/* caption, ticker, controls */
.cap{max-width:920px;width:100%;margin:0 auto;padding:10px 16px;text-align:center;font-size:clamp(14px,1.7vw,17px);line-height:1.4;color:var(--muted);min-height:3.6em}
.ticker{display:flex;align-items:center;border-top:1px solid var(--line);background:var(--wash);overflow:hidden;height:30px;font:12px var(--mono)}
.ticker .lab{flex:none;padding:0 12px;height:100%;display:flex;align-items:center;background:var(--ink);color:var(--bg);font-weight:600;letter-spacing:.1em}
.ticker .run{white-space:nowrap;display:inline-block;padding-left:100%;animation:tick 60s linear infinite;color:var(--muted)}
.ticker .run b{color:var(--ink);font-weight:600;margin:0 6px 0 28px;text-transform:uppercase}
@keyframes tick{to{transform:translateX(-100%)}}
.bar{display:flex;align-items:center;gap:8px;padding:0 16px;border-top:1px solid var(--line);background:var(--panel)}
.bar .sp{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar .sp button{border:0;border-radius:0;border-right:1px solid var(--line);font-family:var(--mono);padding:7px 9px}
.bar .sp button:last-child{border-right:0}
.bar .sp button[aria-pressed="true"]{background:var(--wash);font-weight:600}
.count{font:12px var(--mono);color:var(--muted)}
.start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;background:var(--bg)}
.start h1{max-width:22ch;margin:0 auto}
.start .go{font:600 17px var(--sans);background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:15px 30px}
.start p{margin:0;color:var(--muted);font:13px var(--mono)}
@media (prefers-reduced-motion:reduce){.dot,.ticker .run{animation:none}.slide{transition:opacity .2s}}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="brand"><span class="dot"></span>BRIEF ME</div>
  <p id="dateline"></p>
  <h1 id="headline"></h1>
  <button class="go" id="go">&#9654; Play the brief</button>
  <p id="runtime"></p>
</div>
<div class="top">
  <div class="brand"><span class="dot"></span>BRIEF ME</div>
  <div class="when" id="when"></div>
  <div class="segs" id="segs"></div>
</div>
<div class="stage" id="stage"></div>
<div class="cap" id="cap" aria-live="polite"></div>
<div class="ticker" id="ticker" hidden><span class="lab">QUIET</span><div style="overflow:hidden;flex:1"><span class="run" id="run"></span></div></div>
<div class="bar">
  <button id="prev" aria-label="Previous slide">&#8592;</button>
  <button id="pp">Pause</button>
  <button id="next" aria-label="Next slide">&#8594;</button>
  <span class="count" id="count"></span>
  <div class="sp" role="group" aria-label="Playback speed" id="speed"></div>
</div>
<script>
const EP = /*__EPISODE__*/null;
const $ = id => document.getElementById(id);
const stage = $('stage'), cap = $('cap'), audio = new Audio();
const SITE = {cw:['var(--cw)','Carnivore Weekly'], kd:['var(--kd)','KetoDial'], pd:['var(--pd)','PescoDial']};
const LENS = {cold_open:'Cold open', calendar:'Your week', trend:'Trend', mover:'Biggest mover', spotlight:'Spotlight',
  voice:'Reader voice', experiment:'Experiment check-in', leak:'Funnel leak', quiet_win:'Quiet win',
  head_to_head:'Head to head', ceo:'CEO brief', close:'Before next time', card:'Quiet day',
  week_ahead:'Week ahead', headline:'Back home', trip_day:'Trip', trip_people:'Who you saw', trip_plans:'Coming up'};
const SPEEDS = [1, 1.15, 1.3];
let idx = -1, playing = true, timer = null, rate = 1.15;
try { const r = parseFloat(localStorage.getItem('brief-rate')); if (SPEEDS.includes(r)) rate = r; } catch (e) {}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const svg = (w, h, body, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label || 'chart')}">${body}</svg>`;
const D = i => `transition-delay:${i}ms`;
const legend = () => `<div class="legend">${Object.values(SITE).map(([c, n]) => `<span class="site" style="--acc:${c}"><i></i>${n}</span>`).join('')}</div>`;

/* ---------- visuals: each takes the fact's viz payload and returns markup ---------- */
const V = {
  line(v) {
    const s = v.series.map(Number), n = s.length, W = 640, H = 260, m = {l: 36, r: 16, t: 16, b: 26};
    const max = Math.max(...s, 1) * 1.1, avg = s.reduce((a, b) => a + b, 0) / n;
    const X = i => m.l + (W - m.l - m.r) * i / (n - 1), Y = y => m.t + (H - m.t - m.b) * (1 - y / max);
    const d = 'M' + s.map((y, i) => X(i).toFixed(1) + ' ' + Y(y).toFixed(1)).join('L');
    const lab = v.labels || [], ex = v.excluded || [];
    let o = [0, .5, 1].map(f => { const y = max * f / 1.1; return `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${m.l - 6}" y="${Y(y) + 4}" text-anchor="end">${Math.round(y)}</text>`; }).join('');
    lab.forEach((l, i) => { if (ex.includes(l)) o += `<rect class="fade" x="${X(i) - 8}" y="${m.t}" width="16" height="${H - m.t - m.b}" fill="var(--warn)" fill-opacity=".16"/><text class="fade" x="${X(i)}" y="${m.t + 10}" text-anchor="middle" style="fill:var(--warn)">crawler</text>`; });
    o += `<line class="axis fade" x1="${m.l}" x2="${W - m.r}" y1="${Y(avg)}" y2="${Y(avg)}" stroke-dasharray="4 4"/><text class="fade" x="${W - m.r}" y="${Y(avg) - 5}" text-anchor="end">average</text>`;
    o += `<path class="fade" d="${d}L${X(n - 1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="var(--acc)" fill-opacity=".1"/>`;
    o += `<path class="draw" d="${d}" pathLength="1" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    o += `<circle class="pop" style="${D(1500)}" cx="${X(n - 1)}" cy="${Y(s[n - 1])}" r="5" fill="var(--acc)"/><text class="strong fade" style="${D(1500)}" x="${X(n - 1) - 8}" y="${Y(s[n - 1]) - 10}" text-anchor="end">${s[n - 1]}</text>`;
    const step = Math.ceil(n / 6);
    lab.forEach((l, i) => { if (i % step === 0 || i === n - 1) o += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(l)}</text>`; });
    return svg(W, H, o, v.label);
  },
  bars(v) {
    const s = v.series.map(Number), n = s.length, W = 640, H = 240, m = {l: 10, r: 10, t: 24, b: 30};
    const max = Math.max(...s, 1), bw = (W - m.l - m.r) / n;
    return svg(W, H, s.map((y, i) => {
      const h = (H - m.t - m.b) * y / max, x = m.l + i * bw + bw * .18;
      const col = v.sites ? (SITE[v.sites[i]] || ['var(--acc)'])[0] : (i === n - 1 ? 'var(--acc)' : 'var(--k7)');
      return `<rect class="growy" style="${D(i * 160)}" x="${x}" y="${H - m.b - h}" width="${bw * .64}" height="${h}" rx="4" fill="${col}"/>` +
        `<text class="strong fade" style="${D(400 + i * 160)}" x="${x + bw * .32}" y="${H - m.b - h - 8}" text-anchor="middle">${fmt(y)}${v.unit && i === n - 1 ? ' ' + esc(v.unit) : ''}</text>` +
        `<text x="${x + bw * .32}" y="${H - 8}" text-anchor="middle">${esc((v.labels || [])[i] ?? '')}</text>`;
    }).join(''), v.label);
  },
  wow(v) {
    const metrics = [...new Set(v.rows.map(r => r.metric))], W = 640, rowH = 58, H = metrics.length * rowH + 30, m = {l: 120, r: 24};
    const R = 1, X = c => m.l + (W - m.l - m.r) * ((Math.max(-R, Math.min(R, c)) + R) / (2 * R)), X0 = X(0);
    let o = [-1, -.5, 0, .5, 1].map(c => `<line class="${c === 0 ? 'axis' : 'grid'}" x1="${X(c)}" x2="${X(c)}" y1="4" y2="${H - 24}"/><text x="${X(c)}" y="${H - 8}" text-anchor="middle">${c > 0 ? '+' : ''}${c * 100}%</text>`).join('');
    let k = 0;
    metrics.forEach((mt, i) => {
      const cy = 6 + i * rowH + rowH / 2;
      o += `<text class="strong" x="0" y="${cy + 4}">${esc(mt)}</text>`;
      v.rows.filter(r => r.metric === mt).forEach((r, j) => {
        const c = r.prev ? (r.cur - r.prev) / r.prev : null, off = c === null || Math.abs(c) > R, x = X(c === null ? R : c), y = cy + (j - 1) * 12;
        o += `<circle cx="${X0}" cy="${y}" r="6" fill="${(SITE[r.site] || ['var(--k7)'])[0]}"${off ? ' stroke="var(--ink)" stroke-width="1.5"' : ''} style="transition:transform 1s cubic-bezier(.2,.8,.2,1) ${300 + k++ * 120}ms" data-dx="${(x - X0).toFixed(1)}"><title>${esc(r.site.toUpperCase() + ' ' + mt + ': ' + r.cur + ' vs ' + r.prev)}</title></circle>`;
      });
    });
    return svg(W, H, o, v.label) + legend();
  },
  bubbles(v) {
    const W = 640, H = 300, m = {l: 44, r: 14, t: 14, b: 34}, pts = v.points.filter(p => p.pos <= 40);
    const imax = Math.max(...pts.map(p => p.impr), 10), ly = y => Math.log10(Math.max(y, 1)) / Math.log10(imax * 1.3);
    const X = p => m.l + (W - m.l - m.r) * Math.log(Math.min(Math.max(p, 1), 40)) / Math.log(40), Y = y => m.t + (H - m.t - m.b) * (1 - ly(y));
    let o = `<rect class="fade" x="${X(8)}" y="${m.t}" width="${X(20) - X(8)}" height="${H - m.t - m.b}" fill="var(--wash)"/><text class="fade" x="${(X(8) + X(20)) / 2}" y="${m.t + 12}" text-anchor="middle">within reach</text>`;
    [10, 100, 1000].filter(y => y <= imax * 1.3).forEach(y => o += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${m.l - 6}" y="${Y(y) + 4}" text-anchor="end">${fmt(y)}</text>`);
    [1, 3, 5, 10, 20, 40].forEach(p => o += `<text x="${X(p)}" y="${H - 16}" text-anchor="middle">${p}</text>`);
    o += `<text x="${(W + m.l) / 2}" y="${H - 2}" text-anchor="middle">Google position, further left ranks higher</text>`;
    pts.slice().sort((a, b) => b.impr - a.impr).forEach((p, i) => {
      const inb = p.pos >= 8 && p.pos <= 20, r = 4 + Math.min(16, Math.sqrt(p.clicks) * 2.4);
      o += `<circle class="pop" style="${D(200 + i * 90)}" cx="${X(p.pos)}" cy="${Y(p.impr)}" r="${r}" fill="var(--acc)" fill-opacity="${inb ? .8 : .3}" stroke="var(--acc)"><title>${esc(p.label + ': position ' + p.pos + ', ' + p.impr + ' impressions, ' + p.clicks + ' clicks')}</title></circle>`;
    });
    const top = pts.slice().sort((a, b) => b.clicks - a.clicks)[0];
    if (top) o += `<text class="strong fade" style="${D(1400)}" x="${X(top.pos) + 14}" y="${Y(top.impr) - 14}">${esc(top.label.replace(/^\/blog\/\d{4}-\d{2}-\d{2}-/, '/').slice(0, 30))}</text>`;
    return svg(W, H, o, v.label);
  },
  funnel(v) {
    const steps = v.steps, W = 640, rowH = 40, H = steps.length * rowH + 6, lab = 170, max = Math.max(...steps.map(s => s.value), 1);
    const L = x => x > 0 ? Math.log10(x + 1) / Math.log10(max + 1) : 0;
    return svg(W, H, steps.map((s, i) => {
      const y = 4 + i * rowH, w = Math.max(4, L(s.value) * (W - lab - 130)), prev = i ? steps[i - 1].value : null;
      const pct = prev ? Math.round(s.value / prev * 100) + '% of above' : '';
      return `<text x="0" y="${y + 21}">${esc(s.label.slice(0, 22))}</text><rect class="grow" style="${D(i * 220)}" x="${lab}" y="${y + 6}" width="${w}" height="22" rx="3" fill="var(--acc)" opacity="${Math.max(.35, 1 - i * .1)}"/>` +
        `<text class="strong fade" style="${D(300 + i * 220)}" x="${lab + w + 8}" y="${y + 21}">${fmt(s.value)}</text><text class="fade" style="${D(300 + i * 220)}" x="${lab + w + 14 + String(fmt(s.value)).length * 8}" y="${y + 21}">${pct}</text>`;
    }).join(''), v.label);
  },
  answers(v) {
    const W = 640, rowH = 44, H = v.answers.length * rowH + 8, max = Math.max(...v.answers.map(a => a.value), 1);
    return `<div style="font-size:14px;color:var(--muted);margin-bottom:8px">&ldquo;${esc(v.question)}&rdquo; &middot; ${v.total} answers</div>` +
      svg(W, H, v.answers.map((a, i) => {
        const y = 4 + i * rowH, w = (W - 60) * a.value / max;
        return `<text x="0" y="${y + 12}" class="strong" style="font-family:var(--sans);font-size:13px">${esc(a.label)}</text><rect class="grow" style="${D(i * 200)}" x="0" y="${y + 18}" width="${w}" height="16" rx="3" fill="var(--acc)" opacity="${1 - i * .15}"/><text class="fade" style="${D(300 + i * 200)}" x="${w + 8}" y="${y + 31}">${a.value}</text>`;
      }).join(''), v.label);
  },
  people(v) {
    return `<div class="people">${v.people.map((p, i) => `<span class="pp fade${p.new ? ' new' : ''}" style="${D(i * 120)}">` +
      `<b>${esc(p.name)}</b>${p.new ? '<em>new</em>' : ''}${p.note ? `<small>${esc(p.note)}</small>` : ''}</span>`).join('')}</div>`;
  },
  quote(v) { return `<div class="quote fade">${esc(v.quote)}<small>${esc(v.who)}</small></div>`; },
  timeline(v) {
    const it = v.items, W = 640, HH = 150, n = it.length, X = i => 40 + (W - 80) * (n === 1 ? .5 : i / (n - 1));
    let o = `<line class="axis" x1="20" x2="${W - 20}" y1="${HH / 2}" y2="${HH / 2}"/>`;
    it.forEach((t, i) => {
      const up = i % 2 === 0, x = X(i), y = HH / 2;
      o += `<circle class="pop" style="${D(300 + i * 180)}" cx="${x}" cy="${y}" r="7" fill="var(--acc)"/>` +
        `<text class="strong fade" style="${D(300 + i * 180)}" x="${x}" y="${up ? y - 30 : y + 40}" text-anchor="middle">${esc(t.date)}</text>` +
        `<text class="fade" style="${D(400 + i * 180)}" x="${x}" y="${up ? y - 16 : y + 54}" text-anchor="middle">${esc(t.label.slice(0, 20))}</text>`;
    });
    return svg(W, HH + 10, o, v.label);
  },
  week(v) {
    const W = 640, cw = W / 7, maxEv = Math.max(1, ...v.days.map(d => v.events.filter(e => e.date === d).length)), H = 60 + maxEv * 54;
    let o = '';
    v.days.forEach((d, i) => {
      const dt = new Date(d + 'T12:00:00'), ev = v.events.filter(e => e.date === d), x = i * cw;
      o += `<rect class="pop" style="${D(i * 80)}" x="${x + 3}" y="0" width="${cw - 6}" height="${H}" rx="8" fill="${ev.length ? 'var(--wash)' : 'transparent'}" stroke="var(--line)"/>` +
        `<text x="${x + cw / 2}" y="22" text-anchor="middle" class="strong">${i === 0 ? 'Today' : dt.toLocaleDateString('en-US', {weekday: 'short'})}</text>` +
        `<text x="${x + cw / 2}" y="38" text-anchor="middle">${dt.toLocaleDateString('en-US', {month: 'short', day: 'numeric'})}</text>`;
      ev.forEach((e, j) => {
        o += `<rect class="pop" style="${D(600 + i * 80)}" x="${x + 7}" y="${50 + j * 54}" width="${cw - 14}" height="46" rx="5" fill="${e.kind === 'trip' ? 'var(--warn)' : 'var(--acc)'}"/>` +
          `<text x="${x + cw / 2}" y="${68 + j * 54}" text-anchor="middle" style="fill:var(--bg);font-weight:600">${esc(e.time)}</text>` +
          `<text x="${x + cw / 2}" y="${84 + j * 54}" text-anchor="middle" style="fill:var(--bg);font-size:9px">${esc(e.title.slice(0, 12))}</text>`;
      });
    });
    return svg(W, H, o, v.label);
  },
};

function build() {
  const segs = $('segs');
  EP.slides.forEach((s, i) => {
    const el = document.createElement('section'); el.className = 'slide';
    el.style.setProperty('--acc', s.site && SITE[s.site] ? SITE[s.site][0] : 'var(--k1)');
    const bn = s.big_number, dl = bn && bn.delta;
    const left = (bn ? `<div><div class="big" data-to="${esc(bn.value)}">${esc(bn.value)}</div><div class="biglab">${esc(bn.label || '')}</div>` +
      (dl ? `<span class="delta ${esc(dl.dir || 'flat')}">${dl.dir === 'up' ? '&#9650; ' : dl.dir === 'down' ? '&#9660; ' : ''}${esc(dl.text)}</span>` : '') + `</div>` : '') +
      (s.bullets && s.bullets.length ? `<ul>${s.bullets.map((b, j) => `<li style="${D(350 + j * 220)}">${esc(b)}</li>`).join('')}</ul>` : '');
    const vis = s.visual && V[s.visual.type] ? `<div class="panel">${V[s.visual.type](s.visual)}</div>` : '';
    el.innerHTML = `<div class="meta"><span class="pill">${esc(s.kicker || LENS[s.lens] || '')}</span>` +
      (s.site && SITE[s.site] ? `<span class="site"><i></i>${SITE[s.site][1]}</span>` : '') + `</div>` +
      `<h1>${esc(s.title || '')}</h1>` +
      `<div class="body${vis && left ? '' : ' solo'}">${left ? `<div>${left}</div>` : ''}${vis}</div>`;
    stage.appendChild(el);
    segs.insertAdjacentHTML('beforeend', '<i><b></b></i>');
  });
  $('speed').innerHTML = SPEEDS.map(r => `<button type="button" data-r="${r}" aria-pressed="${r === rate}">${r}&times;</button>`).join('');
  $('speed').querySelectorAll('button').forEach(b => b.onclick = () => {
    rate = +b.dataset.r; audio.playbackRate = rate;
    try { localStorage.setItem('brief-rate', rate); } catch (e) {}
    $('speed').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  if (EP.ticker && EP.ticker.length) {
    $('ticker').hidden = false;
    $('run').innerHTML = EP.ticker.map(t => `<b>${esc(t.area)}</b>${esc(t.text)}`).join('');
  }
}

function countUp(el) {
  const m = el.dataset.to.match(/^([^\d-]*)(-?[\d,]*\.?\d+)(.*)$/); if (!m) return;
  const target = parseFloat(m[2].replace(/,/g, '')), dec = (m[2].split('.')[1] || '').length, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 1000), v = target * (1 - Math.pow(1 - k, 3));
    el.textContent = m[1] + v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}) + m[3]; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function animate(el) {
  const b = el.querySelector('.big'); if (b) countUp(b);
  el.querySelectorAll('.draw').forEach(p => { p.style.transition = 'none'; p.style.strokeDashoffset = 1;
    requestAnimationFrame(() => requestAnimationFrame(() => { p.style.transition = 'stroke-dashoffset 1.6s ease'; p.style.strokeDashoffset = 0; })); });
  el.querySelectorAll('circle[data-dx]').forEach(c => { c.style.transform = 'translateX(0)'; requestAnimationFrame(() => requestAnimationFrame(() => c.style.transform = `translateX(${c.dataset.dx}px)`)); });
}

function sentences(t) { return (t || '').match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g) || ['']; }
function setCaption(s, frac) {
  const ss = sentences(s.narration), total = ss.join('').length || 1; let acc = 0, i = 0;
  for (; i < ss.length - 1; i++) { acc += ss[i].length; if (acc / total > frac) break; }
  const t = ss[i].trim(); if (cap.textContent !== t) cap.textContent = t;
}
function seg(i, frac) { const b = $('segs').children[i]; if (b) b.firstChild.style.width = (frac * 100) + '%'; }

function show(i) {
  if (i >= EP.slides.length) { playing = false; $('pp').textContent = 'Replay'; return; }
  if (i < 0) return;
  clearTimeout(timer); audio.pause();
  const els = [...stage.children];
  els.forEach((e, j) => { e.classList.toggle('on', j === i); e.classList.toggle('off', j < i); });
  [...$('segs').children].forEach((_, j) => seg(j, j < i ? 1 : 0));
  idx = i; const s = EP.slides[i];
  animate(els[i]); setCaption(s, 0);
  $('count').textContent = `${i + 1}/${EP.slides.length}`;
  if (!playing) return;
  if (s.audio) { audio.src = s.audio; audio.playbackRate = rate; audio.play().catch(() => fallback(s)); audio.onended = () => { seg(idx, 1); timer = setTimeout(() => show(idx + 1), 350); }; }
  else fallback(s);
}
function fallback(s) { const ms = Math.max(4500, (s.narration || '').split(/\s+/).length / (2.6 * rate) * 1000); timer = setTimeout(() => show(idx + 1), ms); }
audio.ontimeupdate = () => { if (idx >= 0 && audio.duration) { const f = audio.currentTime / audio.duration; setCaption(EP.slides[idx], f); seg(idx, f); } };
function toggle() {
  if ($('pp').textContent === 'Replay') { playing = true; $('pp').textContent = 'Pause'; return show(0); }
  playing = !playing; $('pp').textContent = playing ? 'Pause' : 'Play';
  if (playing) { if (audio.src && !audio.ended && audio.currentTime > 0) audio.play(); else show(idx); } else { audio.pause(); clearTimeout(timer); }
}

$('dateline').textContent = EP.dateline || ''; $('when').textContent = EP.dateline || '';
$('headline').textContent = EP.headline || 'Your brief';
$('runtime').textContent = `${EP.slides.length} slides${EP.runtime ? ' · about ' + EP.runtime : ''}`;
build();
$('go').onclick = () => { $('start').style.display = 'none'; show(0); };
$('pp').onclick = toggle; $('next').onclick = () => show(idx + 1); $('prev').onclick = () => show(idx - 1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(idx + 1); else if (e.key === 'ArrowLeft') show(idx - 1); else if (e.key === ' ') { e.preventDefault(); toggle(); } });
</script>
</body>
</html>
