<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e8;--ink:#1d1a16;--muted:#6b6257;--accent:#b23a1e;--accent2:#2f6f62;--card:#fffaf2;--line:#d9cfbf}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110e;--ink:#f3ece0;--muted:#a89c8c;--accent:#ff7a52;--accent2:#6fc2ae;--card:#1e1a15;--line:#3a332a}}
:root[data-theme="dark"]{--bg:#14110e;--ink:#f3ece0;--muted:#a89c8c;--accent:#ff7a52;--accent2:#6fc2ae;--card:#1e1a15;--line:#3a332a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:1fr auto 56px;height:100dvh}
.stage{position:relative;overflow:hidden;min-height:0}
.slide{position:absolute;inset:0;overflow-y:auto;padding:clamp(16px,5vw,64px) clamp(16px,6vw,72px);display:flex;flex-direction:column;justify-content:flex-start;gap:clamp(10px,2vh,22px);opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s;pointer-events:none;max-width:1100px;margin:0 auto}
.slide>:first-child{margin-top:auto}.slide>:last-child{margin-bottom:auto}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(26px,min(5.4vw,7vh),64px);line-height:1.04;margin:0}
.big{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(48px,min(13vw,16vh),150px);line-height:.9;color:var(--accent)}
.big small{display:block;font-family:Inter,sans-serif;font-size:clamp(13px,1.6vw,17px);font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:8px}
ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
li{font-size:clamp(16px,2.1vw,22px);line-height:1.35;padding-left:22px;position:relative;opacity:0;transform:translateX(-10px);transition:all .5s}
li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:2px;background:var(--accent2)}
.slide.on li{opacity:1;transform:none}
.chart{width:100%;max-width:820px;height:clamp(90px,22vh,240px);flex-shrink:0}
.chart path.line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.chart path.area{fill:var(--accent);opacity:0;transition:opacity 1.2s .8s}.slide.on .chart path.area{opacity:.12}
.chart line{stroke:var(--line)}
.chart rect{fill:var(--accent2);transform-origin:bottom;transform-box:fill-box;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.slide.on .chart rect{transform:scaleY(1)}
.chart text{fill:var(--muted);font-size:11px;font-family:Inter,sans-serif}
@media (max-height:700px){.chart{height:70px}.big{font-size:56px}ul{gap:4px}}
.cap{width:100%;max-width:900px;margin:0 auto;padding:10px 16px 12px;text-align:center;font-size:clamp(14px,1.8vw,18px);color:var(--muted);line-height:1.4;min-height:3.8em}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-top:1px solid var(--line);background:var(--card)}
.bar button{font:600 14px Inter,sans-serif;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.bar button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.prog{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.count{font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:5;text-align:center;padding:16px}
.start button{font:700 20px Inter,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:18px 36px;cursor:pointer}
.start p{color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="kicker" id="dateline"></div>
  <h1 id="headline" style="max-width:800px"></h1>
  <button id="go">&#9654; Play the brief</button>
  <p id="runtime"></p>
</div>
<div class="stage" id="stage"></div>
<div class="cap" id="cap"></div>
<div class="bar">
  <button class="ghost" id="prev" aria-label="Previous">&#8592;</button>
  <button id="pp">Pause</button>
  <button class="ghost" id="next" aria-label="Next">&#8594;</button>
  <div class="prog"><i id="prog"></i></div>
  <div class="count" id="count"></div>
</div>
<script>
const EP = /*__EPISODE__*/null;
const stage = document.getElementById('stage');
const cap = document.getElementById('cap');
let idx = -1, playing = true, timer = null, audio = new Audio();

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function chartSvg(c){
  if(!c||!c.series||!c.series.length) return '';
  const W=820,H=220,P=26,s=c.series.map(Number),max=Math.max(...s,1),n=s.length;
  if(c.type==='bars'||n<=6){
    const bw=(W-2*P)/n;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(c.label||'chart')}">`+
      s.map((v,i)=>{const h=(H-2*P)*v/max,x=P+i*bw+bw*.15;return `<rect x="${x}" y="${H-P-h}" width="${bw*.7}" height="${h}" rx="3" style="transition-delay:${i*90}ms"/><text x="${x+bw*.35}" y="${H-8}" text-anchor="middle">${esc((c.labels||[])[i]??'')}</text><text x="${x+bw*.35}" y="${H-P-h-6}" text-anchor="middle">${v}</text>`}).join('')+`</svg>`;
  }
  const pts=s.map((v,i)=>[P+i*(W-2*P)/(n-1),H-P-(H-2*P)*v/max]);
  const d='M'+pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join('L');
  const lab=c.labels||[],last=pts[n-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(c.label||'chart')}">`+
    `<line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}"/>`+
    `<path class="area" d="${d}L${W-P},${H-P}L${P},${H-P}Z"/>`+
    `<path class="line" d="${d}" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/>`+
    `<text x="${P}" y="${H-6}">${esc(lab[0]??'')}</text><text x="${W-P}" y="${H-6}" text-anchor="end">${esc(lab[n-1]??'')}</text>`+
    `<text x="${last[0]}" y="${last[1]-8}" text-anchor="end">${s[n-1]}</text></svg>`;
}

function build(){
  EP.slides.forEach((s,i)=>{
    const el=document.createElement('section');el.className='slide';
    const big=s.big_number?`<div class="big" data-to="${esc(s.big_number.value)}">${esc(s.big_number.value)}<small>${esc(s.big_number.label||'')}</small></div>`:'';
    el.innerHTML=`<div class="kicker">${esc(s.kicker||'')}</div><h1>${esc(s.title||'')}</h1>${big}`+
      (s.bullets&&s.bullets.length?`<ul>${s.bullets.map((b,j)=>`<li style="transition-delay:${300+j*250}ms">${esc(b)}</li>`).join('')}</ul>`:'')+chartSvg(s.chart);
    stage.appendChild(el);
  });
}

function countUp(el){
  const raw=el.dataset.to,m=raw.match(/^([^\d-]*)(-?[\d,]*\.?\d+)(.*)$/);if(!m) return;
  const target=parseFloat(m[2].replace(/,/g,'')),dec=(m[2].split('.')[1]||'').length,t0=performance.now(),small=el.querySelector('small').outerHTML;
  const step=t=>{const k=Math.min(1,(t-t0)/1100),v=target*(1-Math.pow(1-k,3));
    el.innerHTML=m[1]+v.toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec})+m[3]+small;if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

function show(i){
  if(i<0||i>=EP.slides.length) return;
  clearTimeout(timer);audio.pause();
  idx=i;const els=[...stage.children];
  els.forEach((e,j)=>e.classList.toggle('on',j===i));
  const s=EP.slides[i],el=els[i];
  const b=el.querySelector('.big');if(b)countUp(b);
  const line=el.querySelector('path.line');
  if(line){line.style.transition='none';line.style.strokeDashoffset=1;requestAnimationFrame(()=>{line.style.transition='stroke-dashoffset 1.8s ease';line.style.strokeDashoffset=0})}
  setCaption(s,0);
  document.getElementById('prog').style.width=((i+1)/EP.slides.length*100)+'%';
  document.getElementById('count').textContent=`${i+1}/${EP.slides.length}`;
  if(!playing) return;
  if(s.audio){audio.src=s.audio;audio.play().catch(()=>fallback(s));audio.onended=()=>timer=setTimeout(()=>show(idx+1),700)}
  else fallback(s);
}
function sentences(t){return (t||'').match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g)||['']}
function setCaption(s,frac){const ss=sentences(s.narration),total=ss.join('').length||1;let acc=0,i=0;
  for(;i<ss.length-1;i++){acc+=ss[i].length;if(acc/total>frac)break}
  const t=ss[i].trim();if(cap.textContent!==t)cap.textContent=t}
audio.ontimeupdate=()=>{if(idx>=0&&audio.duration)setCaption(EP.slides[idx],audio.currentTime/audio.duration)};
function fallback(s){const ms=Math.max(5000,(s.narration||'').split(/\s+/).length/2.6*1000);timer=setTimeout(()=>show(idx+1),ms)}
function toggle(){playing=!playing;document.getElementById('pp').textContent=playing?'Pause':'Play';
  if(playing){if(audio.src&&!audio.ended&&audio.currentTime>0)audio.play();else show(idx)}else{audio.pause();clearTimeout(timer)}}

document.getElementById('dateline').textContent=EP.dateline||'';
document.getElementById('headline').textContent=EP.headline||'Your brief';
document.getElementById('runtime').textContent=`${EP.slides.length} slides${EP.runtime?', about '+EP.runtime:''}`;
build();
document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';show(0)};
document.getElementById('pp').onclick=toggle;
document.getElementById('next').onclick=()=>show(idx+1);
document.getElementById('prev').onclick=()=>show(idx-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(idx+1);else if(e.key==='ArrowLeft')show(idx-1);else if(e.key===' '){e.preventDefault();toggle()}});
</script>
</body>
</html>
