<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .design { width: 4500px; height: 5100px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: transparent; }
  .pyramid { text-align: center; }
  .pyramid .title { font-family: 'Helvetica', sans-serif; font-size: 160px; color: #ffd700; letter-spacing: 16px; text-transform: uppercase; font-weight: 700; margin-bottom: 80px; }
  .tier { font-family: 'Georgia', serif; color: #ffffff; margin: 20px 0; display: flex; align-items: center; justify-content: center; }
  .tier .bar { height: 100%; display: flex; align-items: center; justify-content: center; padding: 30px 0; }
  .t1 .bar { background: #4a0404; width: 600px; font-size: 140px; font-weight: 700; letter-spacing: 8px; }
  .t2 .bar { background: #6b1010; width: 1000px; font-size: 130px; letter-spacing: 6px; }
  .t3 .bar { background: #8b2020; width: 1400px; font-size: 130px; letter-spacing: 6px; }
  .t4 .bar { background: #a33030; width: 1800px; font-size: 130px; letter-spacing: 6px; }
  .t5 .bar { background: #c04040; width: 2200px; font-size: 140px; font-weight: 700; letter-spacing: 8px; }
  .pyramid .sub { font-family: 'Helvetica', sans-serif; font-size: 100px; color: #999; letter-spacing: 20px; text-transform: uppercase; margin-top: 100px; }
</style></head>
<body>
<div class="design">
  <div class="pyramid">
    <div class="title">The Real Food Pyramid</div>
    <div class="tier t1"><div class="bar">RIBEYE</div></div>
    <div class="tier t2"><div class="bar">GROUND BEEF &bull; EGGS</div></div>
    <div class="tier t3"><div class="bar">BACON &bull; BUTTER &bull; SALT</div></div>
    <div class="tier t4"><div class="bar">LAMB &bull; PORK &bull; FISH &bull; ORGANS</div></div>
    <div class="tier t5"><div class="bar">BONE BROTH &bull; TALLOW &bull; WATER</div></div>
    <div class="sub">carnivoreweekly.com</div>
  </div>
</div>
</body></html>
