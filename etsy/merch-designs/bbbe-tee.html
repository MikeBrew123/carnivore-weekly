<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .design { width: 4500px; height: 5100px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: transparent; }
  .bbbe { text-align: center; font-family: 'Helvetica', sans-serif; }
  .bbbe .letters { display: flex; gap: 60px; justify-content: center; margin-bottom: 60px; }
  .bbbe .letter { width: 500px; height: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 8px solid #ffd700; border-radius: 40px; }
  .bbbe .letter .big { font-size: 300px; font-weight: 900; color: #ffd700; line-height: 1; }
  .bbbe .letter .word { font-size: 80px; color: #ffffff; text-transform: uppercase; letter-spacing: 4px; margin-top: 10px; }
  .bbbe .tagline { font-size: 120px; color: #ffffff; margin-top: 80px; font-style: italic; font-family: 'Georgia', serif; }
  .bbbe .sub { font-size: 90px; color: #666; letter-spacing: 16px; text-transform: uppercase; margin-top: 60px; }
</style></head>
<body>
<div class="design">
  <div class="bbbe">
    <div class="letters">
      <div class="letter"><div class="big">B</div><div class="word">Beef</div></div>
      <div class="letter"><div class="big">B</div><div class="word">Bacon</div></div>
      <div class="letter"><div class="big">B</div><div class="word">Butter</div></div>
      <div class="letter"><div class="big">E</div><div class="word">Eggs</div></div>
    </div>
    <div class="tagline">That's the whole plan.</div>
    <div class="sub">carnivoreweekly.com</div>
  </div>
</div>
</body></html>
