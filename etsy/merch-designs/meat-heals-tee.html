<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>

  .meat-heals { font-family: 'Georgia', serif; text-align: center; }
  .meat-heals .top { font-size: 420px; font-weight: 700; color: #ffd700; letter-spacing: 12px; text-transform: uppercase; }

  .meat-heals .divider { width: 600px; height: 8px; background: #ffd700; margin: 40px auto; }
  .meat-heals .sub { font-size: 120px; color: #999; letter-spacing: 20px; text-transform: uppercase; font-family: 'Helvetica', sans-serif; margin-top: 60px; }
</style></head>
<body>
<div class="design">
  <div class="meat-heals">
    <div class="top">MEAT</div>
    <div class="divider"></div>
    <div class="bottom">HEALS</div>

  </div>
</div>
