name = "carnivore-report-api"
main = "calculator-api.js"
compatibility_date = "2024-12-19"
compatibility_flags = ["nodejs_compat"]

# Local development environment (wrangler dev - no env prefix)
vars = { ENVIRONMENT = "development", SUPABASE_URL = "https://kwtdpvnjewtahuxjyltn.supabase.co", GA4_MEASUREMENT_ID = "G-NR4JVKW2JV" }

# Secrets (stored securely in Cloudflare, not in this file)
# Supabase credentials - MOVED TO WRANGLER SECRETS (2026-01-05)
# Add these via: wrangler secret put VARIABLE_NAME
# Supabase secrets:
# - SUPABASE_PROJECT_ID: Project ID for Supabase (uploaded)
# - SUPABASE_HOST: Database host (uploaded)
# - SUPABASE_PORT: Database port 5432 (uploaded)
# - SUPABASE_DATABASE: Database name postgres (uploaded)
# - SUPABASE_USERNAME: Database username postgres (uploaded)
# - SUPABASE_PASSWORD: Postgres password (uploaded)
# - SUPABASE_ANON_KEY: Anonymous key for public access (uploaded)
# - SUPABASE_SERVICE_ROLE_KEY: Service role key for admin access (uploaded)
#
# Other required secrets:
# - STRIPE_SECRET_KEY: Stripe API secret key
# - STRIPE_PUBLISHABLE_KEY: Stripe publishable key
# - CLAUDE_API_KEY: Anthropic Claude API key
# - FRONTEND_URL: Frontend domain for CORS
# - API_BASE_URL: API base URL
#
# Etsy integration secrets:
# - ETSY_CLIENT_ID: Etsy API key
# - ETSY_CLIENT_SECRET: Etsy shared secret (not used in PKCE but good to have)
# - ETSY_REDIRECT_URI: OAuth callback URL

# KV Namespace for Etsy PKCE state storage
[[kv_namespaces]]
binding = "ETSY_AUTH_KV"
id = "022b2eba60cb4e39bec97759109e7acf"

# NOTE: in Wrangler, named environments do NOT inherit top-level `vars` or
# `kv_namespaces`. Every binding an environment needs has to be repeated below,
# or that environment's Worker simply will not have it at runtime.

# Staging environment variables
[env.staging]
vars = { ENVIRONMENT = "staging", SUPABASE_URL = "https://kwtdpvnjewtahuxjyltn.supabase.co", GA4_MEASUREMENT_ID = "G-NR4JVKW2JV" }

# Etsy PKCE state storage for staging.
# Same namespace as dev/production: PKCE state is short-lived, keyed by a random
# `state` value, and deleted on use, so there is no cross-environment collision.
[[env.staging.kv_namespaces]]
binding = "ETSY_AUTH_KV"
id = "022b2eba60cb4e39bec97759109e7acf"

# Production environment variables
[env.production]
vars = { ENVIRONMENT = "production", SUPABASE_URL = "https://kwtdpvnjewtahuxjyltn.supabase.co", FRONTEND_URL = "https://carnivoreweekly.com", GA4_MEASUREMENT_ID = "G-NR4JVKW2JV" }

# Etsy PKCE state storage for production.
# Without this the production Worker has no ETSY_AUTH_KV binding, and because
# calculator-api.js uses optional chaining (env.ETSY_AUTH_KV?.put/get) the Etsy
# OAuth flow fails SILENTLY rather than erroring.
[[env.production.kv_namespaces]]
binding = "ETSY_AUTH_KV"
id = "022b2eba60cb4e39bec97759109e7acf"
