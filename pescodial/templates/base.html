<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PescoDial{% endblock %}</title>
<meta name="description" content="{% block description %}Pescatarian eating for heart health, with a free calculator.{% endblock %}">
<link rel="canonical" href="{{ canonical }}">
{% if prelaunch %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="stylesheet" href="/css/site.css">
<script src="/js/analytics.js"></script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:site_name" content="PescoDial">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ domain }}/og.png">
<meta name="twitter:card" content="summary_large_image">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="/" aria-label="PescoDial home">Pesco<span>Dial</span></a>
    <nav class="site-nav" aria-label="Main">
      {% if posts %}<a href="/guides/">Guides</a>{% endif %}
      <a href="/about/">About</a>
    </nav>
  </div>
</header>
<div class="scallop" aria-hidden="true"></div>
<main id="main">{% block main %}{% endblock %}</main>
<footer class="site-footer">
  <div class="wrap">
    <nav aria-label="Footer">
      <a href="/about/">About</a>
      <a href="/privacy/">Privacy</a>
      <a href="/contact/">Contact</a>
    </nav>
    <p class="small">General information, not medical advice.</p>
    <p class="small">© 2026 PescoDial</p>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
