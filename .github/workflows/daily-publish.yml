name: Daily Blog Publisher

on:
  schedule:
    # Runs every day at 9:00 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.KD_DEPLOY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml html5lib markdown jinja2 supabase python-dotenv requests

      - name: Send drip emails (7-Day Starter)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/send_drip.py

      - name: Publish CW scheduled posts
        id: publish_cw
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/daily_publish.py --site cw
          git add -A
          NEW_POSTS=$(git diff --staged --name-only | grep "^public/blog/.*\.html$" | grep -v "index.html" || true)
          if [ -n "$NEW_POSTS" ]; then
            URLS=$(echo "$NEW_POSTS" | sed 's|public/blog/|https://carnivoreweekly.com/blog/|')
            echo "new_post_urls<<EOF" >> $GITHUB_OUTPUT
            echo "$URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish KD scheduled posts
        id: publish_kd
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/daily_publish.py --site kd
          python3 ketodial/scripts/generate_kd_blog.py --only-new
          git add -A
          NEW_POSTS=$(git diff --staged --name-only | grep "^ketodial/public/blog/.*\.html$" | grep -v "index.html" || true)
          if [ -n "$NEW_POSTS" ]; then
            KD_URLS=$(echo "$NEW_POSTS" | sed 's|ketodial/public/blog/|https://ketodial.com/blog/|')
            echo "new_post_urls<<EOF" >> $GITHUB_OUTPUT
            echo "$KD_URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy KD to ketodial repo
        if: steps.publish_kd.outputs.has_changes == 'true'
        env:
          KD_DEPLOY_TOKEN: ${{ secrets.KD_DEPLOY_TOKEN }}
        run: |
          cd ketodial/public
          git remote set-url origin https://x-access-token:${KD_DEPLOY_TOKEN}@github.com/MikeBrew123/ketodial.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: publish KD blog posts for $(date +%Y-%m-%d)"
          git push origin main

      - name: Commit and push if changes
        if: steps.publish_cw.outputs.has_changes == 'true' || steps.publish_kd.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: publish scheduled blog posts for $(date +%Y-%m-%d)"
          git push || true

      - name: Submit CW posts to Google Indexing API
        if: steps.publish_cw.outputs.has_changes == 'true' && steps.publish_cw.outputs.new_post_urls != ''
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > dashboard/ga4-credentials.json
          cd dashboard && npm install --silent
          URLS="${{ steps.publish_cw.outputs.new_post_urls }}"
          node gsc-request-indexing.js $URLS

      - name: Submit CW posts to Bing via IndexNow
        if: steps.publish_cw.outputs.has_changes == 'true' && steps.publish_cw.outputs.new_post_urls != ''
        continue-on-error: true
        run: |
          URLS="${{ steps.publish_cw.outputs.new_post_urls }}"
          URL_LIST=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"carnivoreweekly.com\",
              \"key\": \"1d6e43b8829d44c28fbef02ee5b548d2\",
              \"keyLocation\": \"https://carnivoreweekly.com/1d6e43b8829d44c28fbef02ee5b548d2.txt\",
              \"urlList\": $URL_LIST
            }"
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') CW URLs to IndexNow"

      - name: Submit KD posts to Google Indexing API
        if: steps.publish_kd.outputs.has_changes == 'true' && steps.publish_kd.outputs.new_post_urls != ''
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > dashboard/ga4-credentials.json
          cd dashboard && npm install --silent
          URLS="${{ steps.publish_kd.outputs.new_post_urls }}"
          node gsc-request-indexing.js $URLS

      - name: Submit KD posts to Bing via IndexNow
        if: steps.publish_kd.outputs.has_changes == 'true' && steps.publish_kd.outputs.new_post_urls != ''
        continue-on-error: true
        run: |
          URLS="${{ steps.publish_kd.outputs.new_post_urls }}"
          URL_LIST=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"ketodial.com\",
              \"key\": \"98237dd632e84e4e8743193ac2e1ee61\",
              \"keyLocation\": \"https://ketodial.com/98237dd632e84e4e8743193ac2e1ee61.txt\",
              \"urlList\": $URL_LIST
            }"
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') KD URLs to IndexNow"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main  # Ensure we get the latest commit including any just-pushed changes

      - name: Pull latest
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
