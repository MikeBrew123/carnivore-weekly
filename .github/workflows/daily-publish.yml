name: Daily Blog Publisher

on:
  schedule:
    # Runs every day at 9:00 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml html5lib markdown jinja2 supabase python-dotenv requests

      - name: Send drip emails (7-Day Starter)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/send_drip.py

      - name: Publish scheduled posts
        id: publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/daily_publish.py
          # Stage all changes so git diff --staged can detect new files
          git add -A
          # Capture newly published HTML files for indexing
          NEW_POSTS=$(git diff --staged --name-only | grep "^public/blog/.*\.html$" | grep -v "index.html" || true)
          if [ -n "$NEW_POSTS" ]; then
            URLS=$(echo "$NEW_POSTS" | sed 's|public/blog/|https://carnivoreweekly.com/blog/|')
            echo "new_post_urls<<EOF" >> $GITHUB_OUTPUT
            echo "$URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changes
        if: steps.publish.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: publish scheduled blog posts for $(date +%Y-%m-%d)"
          git push || true

      - name: Submit new posts to Google Indexing API
        if: steps.publish.outputs.has_changes == 'true' && steps.publish.outputs.new_post_urls != ''
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > dashboard/ga4-credentials.json
          cd dashboard && npm install --silent
          URLS="${{ steps.publish.outputs.new_post_urls }}"
          node gsc-request-indexing.js $URLS

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main  # Ensure we get the latest commit including any just-pushed changes

      - name: Pull latest
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
