name: Daily Blog Publisher

on:
  schedule:
    # Runs every day at 9:00 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  # Lets the publish job dispatch pescodial-deploy.yml after a PD publish.
  actions: write

# Own group, not the "pages" group shared with deploy.yml (Brew, deck card
# 1f3f2f68, 2026-09-30; bead wxmk). On 2026-09-14 two dispatches 32s apart
# left a publisher run queued behind the first under "pages", one step away
# from a second drip send. GitHub still lets one run wait here (a newer one
# replaces it), so the real stop is the same-day lock in send_drip.py: a run
# that finds today's drip already sent mails nobody. The deploy job below
# keeps the "pages" group so it still serialises with deploy.yml.
concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      # Set by scripts/resend_quota.py when Resend refused a drip send over
      # quota. Read by the health-check job, which turns the run red.
      resend_quota_refused: ${{ steps.drip.outputs.resend_quota_refused == 'true' || steps.kd_drip.outputs.resend_quota_refused == 'true' || steps.pd_drip.outputs.resend_quota_refused == 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.KD_DEPLOY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml html5lib markdown jinja2 supabase python-dotenv requests "pillow>=10.0.0"

      - name: Send drip emails (Your First Weeks on Carnivore)
        id: drip
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          # Mints per-subscriber expiring promo codes for day-7/day-28 sends;
          # if absent the sends fall back to static DRIP50 (no expiry claim)
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: python3 scripts/send_drip.py

      - name: Alert on drip failure
        if: steps.drip.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 Drip send failed in daily-publish"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "send_drip.py exited non-zero on $(date -u +%F). Subscribers are NOT receiving drip emails until this is fixed — the backlog grows daily (see ISSUE-043 in docs/project-log/recurring-issues.md). Run: $RUN_URL"
          else
            gh issue comment "$EXISTING" --body "Failed again on $(date -u +%F): $RUN_URL"
          fi

      # KD drip is gated behind the KD_DRIP_ENABLED repo variable until Brew
      # signs off on the copy. Enable with: gh variable set KD_DRIP_ENABLED -b true
      - name: Send KD drip emails (30-Day Keto Starter)
        id: kd_drip
        if: vars.KD_DRIP_ENABLED == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # Day 1 from Carnivore Weekly for CW-calculator keto signups. Brew
          # approved the copy on deck 54c86753 (2026-10-01). Set the repo
          # variable to anything but true to switch it off without a deploy.
          KD_CW_INTRO_ENABLED: ${{ vars.KD_CW_INTRO_ENABLED }}
        run: python3 scripts/send_drip.py --site kd

      - name: Alert on KD drip failure
        if: steps.kd_drip.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 KD drip send failed in daily-publish"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "send_drip.py --site kd exited non-zero on $(date -u +%F). KD subscribers are NOT receiving drip emails until this is fixed. Run: $RUN_URL"
          else
            gh issue comment "$EXISTING" --body "Failed again on $(date -u +%F): $RUN_URL"
          fi

      # PescoDial welcome drip (Sarah's fact-checked copy, built by
      # pescodial/scripts/build_pd_drip.py). OFF until Brew approves sending:
      #   gh variable set PD_DRIP_ENABLED -b true
      # Day 7 and 28 go out as plain emails: PD has no offer yet, so no Stripe
      # code is minted (tests/test_pd_drip.py).
      - name: Send PD drip emails (PescoDial welcome)
        id: pd_drip
        if: vars.PD_DRIP_ENABLED == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: python3 scripts/send_drip.py --site pd

      - name: Alert on PD drip failure
        if: steps.pd_drip.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 PD drip send failed in daily-publish"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "send_drip.py --site pd exited non-zero on $(date -u +%F). PD subscribers are NOT receiving drip emails until this is fixed. Run: $RUN_URL"
          else
            gh issue comment "$EXISTING" --body "Failed again on $(date -u +%F): $RUN_URL"
          fi

      # Resend quota alarm (Brew, deck 920ebe5a, 2026-09-10). When Resend
      # refuses a drip send over the daily/monthly quota, send_drip.py records
      # it in Supabase email_send_refusals and sets this output. This opens a
      # GitHub issue (subscriber ids only, the repo is public) and the
      # health-check job turns the run red. Neither path uses Resend.
      - name: Alert on Resend quota refusal (drip)
        if: steps.drip.outputs.resend_quota_refused == 'true' || steps.kd_drip.outputs.resend_quota_refused == 'true' || steps.pd_drip.outputs.resend_quota_refused == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resend_quota_alert.sh "${{ runner.temp }}/resend-quota-refusals.md" drip

      # Images must exist BEFORE daily_publish.py renders the HTML, or the post
      # ships imageless. CW was never wired up here (ISSUE-010); KD was. Both
      # draw on the same $1.00/day cap in config/image-budget.json, and the
      # script is forward looking only, so this never sweeps the archive.
      - name: Generate CW post images
        id: cw_images
        continue-on-error: true
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/generate_post_images.py --site cw --max-images 5
          python3 scripts/image_budget.py --status || true

      - name: Publish CW scheduled posts
        id: publish_cw
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/daily_publish.py --site cw
          git add -A
          NEW_POSTS=$(git diff --staged --name-only | grep "^public/blog/.*\.html$" | grep -v "index.html" || true)
          if [ -n "$NEW_POSTS" ]; then
            URLS=$(echo "$NEW_POSTS" | sed 's|public/blog/|https://carnivoreweekly.com/blog/|')
            echo "new_post_urls<<EOF" >> $GITHUB_OUTPUT
            echo "$URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate KD post images
        id: kd_images
        continue-on-error: true
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/generate_post_images.py --site kd --max-images 5
          python3 scripts/image_budget.py --status || true

      # The ledger is the only record of what was spent, and the CEO brief reads
      # it. If it changed but no post published, the commit step below would skip
      # and the day's spend would vanish, resetting the cap. Flag it explicitly.
      - name: Check if spend ledger changed
        id: ledger
        run: |
          if [ -n "$(git status --porcelain -- data/image-spend-ledger.jsonl)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish KD scheduled posts
        id: publish_kd
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/daily_publish.py --site kd
          python3 ketodial/scripts/generate_kd_blog.py --only-new
          git add -A
          # ketodial/public is a SUBMODULE: a parent-repo staged diff only ever
          # shows the pointer, never blog/*.html paths, so this grep matched
          # nothing and the KD deploy step below NEVER fired — posts were marked
          # published daily with no HTML deployed (ISSUE-063). Detect inside
          # the submodule instead.
          NEW_POSTS=$(git -C ketodial/public status --porcelain -- blog | awk '{print $2}' | grep "\.html$" | grep -v "index.html" || true)
          if [ -n "$NEW_POSTS" ]; then
            KD_URLS=$(echo "$NEW_POSTS" | sed 's|^blog/|https://ketodial.com/blog/|')
            echo "new_post_urls<<EOF" >> $GITHUB_OUTPUT
            echo "$KD_URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # PescoDial (pescodial.com, Cloudflare Pages). daily_publish.py --site pd
      # flips ready -> published under the 2-per-7-day cap and re-renders
      # pescodial/public. The live site is rebuilt by pescodial-deploy.yml from
      # blog_posts.json, so new posts are detected from the JSON status diff,
      # not from HTML paths. No image step: PD posts carry no image field.
      # A PD failure must never cost CW/KD their publish: on any error the JSON
      # and pescodial/public go back to their pre-PD state, an issue opens, and
      # the job carries on.
      - name: Publish PD scheduled posts
        id: publish_pd
        run: |
          BEFORE="$RUNNER_TEMP/blog_posts.before-pd.json"
          cp data/blog_posts.json "$BEFORE"
          set +e
          python3 scripts/daily_publish.py --site pd
          STATUS=$?
          set -e
          if [ "$STATUS" != 0 ]; then
            cp "$BEFORE" data/blog_posts.json
            git checkout -- pescodial/public || true
            git clean -fdq -- pescodial/public || true
            echo "::error title=PD publish failed::daily_publish.py --site pd exited $STATUS. PD changes rolled back; CW/KD unaffected."
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          PD_URLS=$(python3 scripts/pd_publish_check.py newly-published "$BEFORE" data/blog_posts.json) || {
            cp "$BEFORE" data/blog_posts.json
            git checkout -- pescodial/public || true
            git clean -fdq -- pescodial/public || true
            echo "::error title=PD publish check failed::pd_publish_check.py crashed. PD changes rolled back; CW/KD unaffected."
            echo "failed=true" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          }
          git add -A
          if [ -n "$PD_URLS" ]; then
            echo "Newly published PD guides:"
            echo "$PD_URLS"
            echo "new_post_urls<<EOF" >> $GITHUB_OUTPUT
            echo "$PD_URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Alert on PD publish failure
        if: steps.publish_pd.outputs.failed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 PD publish failed in daily-publish"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "daily_publish.py --site pd exited non-zero on $(date -u +%F). The PD changes were rolled back, so ready PescoDial posts stay ready and will retry tomorrow. CW and KD publishing was not affected. Run: $RUN_URL"
          else
            gh issue comment "$EXISTING" --body "Failed again on $(date -u +%F): $RUN_URL"
          fi

      # =====================================================================
      # --- TEMPORARY, switched on 2026-10-05. Review on or after 2026-10-12. -------
      # Runs the ten pre-push gates against this run's generated content, before
      # anything is committed or pushed. Report-only: nothing here blocks
      # publishing, and every later step is independent of it.
      # Seven daily runs are meant to measure how often the gates fire on real
      # content. Promoting any gate to blocking is a separate, deliberate
      # change: there is no automatic switch, by design.
      # To remove the experiment, delete this step. Nothing else depends on it.
      # ----------------------------------------------------------------------
      - name: "Validation gates (REPORT ONLY, does not block publishing)"
        id: gates
        continue-on-error: true
        run: |
          set +e
          python3 scripts/validate_before_commit.py 2>&1 | tee "$RUNNER_TEMP/gates.txt"
          STATUS=${PIPESTATUS[0]}
          set -e

          # Gate 10's checker can fail to import. The validator downgrades that to
          # a warning, so it can hide inside an otherwise ordinary status 2.
          SWEETS_DOWN=no
          if grep -qF "Sweet-treat guardrail could not be loaded" "$RUNNER_TEMP/gates.txt"; then
            SWEETS_DOWN=yes
          fi

          case "$STATUS" in
            0) VERDICT="PASS (no findings)" ;;
            2) VERDICT="PASS with warnings (no critical findings)" ;;
            1) VERDICT="REPORT-ONLY FAILURE (critical findings)" ;;
            *) VERDICT="REPORT-ONLY EXECUTION FAILURE (validator did not run normally)" ;;
          esac

          gates_found() {
            local entry n text desc found=0
            for entry in \
              "1|Future date in filename|future-dated blog filename" \
              "2|missing <!DOCTYPE html>|blog HTML fragment, missing doctype" \
              "3|Sitemap regression|sitemap URL count below baseline" \
              "4|RSS regression|RSS item count below baseline" \
              "5|Main page missing|a main page is missing" \
              "6|Empty-slug HTML file|empty-slug HTML file" \
              "7|Unrendered Jinja2|raw Jinja2 in blog HTML, pipeline bypassed" \
              "8|No date prefix|blog HTML without a date prefix (warning by design)" \
              "9|Made-to-order|Etsy script sets when_made=made_to_order" \
              "10|promotes sweet treats|CW sweet-treat brand rule" \
              "11|Universal K/Mg dose|electrolyte dose (potassium/magnesium)" \
              "11|Universal fasting-Na dose|electrolyte dose (fasting sodium)" \
              "11|Electrolyte dosing guard could not run|electrolyte guard failed to load"
            do
              IFS='|' read -r n text desc <<<"$entry"
              if grep -qF "$text" "$RUNNER_TEMP/gates.txt"; then
                echo "- Gate ${n}: ${desc}"
                found=1
              fi
            done
            [ "$found" = 0 ] && echo "- none"
            return 0
          }

          {
            echo "## Validation gates: report-only observation"
            echo
            [ "$SWEETS_DOWN" = yes ] && echo "> **Gate 10 checker unavailable.** \`cw_sweet_guard\` failed to load, so CW sweet-treat content was NOT checked on this run. This is independent of the verdict below."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Date (UTC) | $(date -u +'%Y-%m-%d %H:%M') |"
            echo "| Run | [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) attempt ${GITHUB_RUN_ATTEMPT} |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Verdict | **${VERDICT}** |"
            echo "| Validator exit status | \`${STATUS}\` |"
            echo "| Findings | $(grep -E '^Summary:' "$RUNNER_TEMP/gates.txt" | tail -1 || echo 'unavailable') |"
            echo "| Gate 10 checker | $([ "$SWEETS_DOWN" = yes ] && echo 'UNAVAILABLE' || echo 'available') |"
            echo
            echo "### Gates that produced findings"
            echo
            gates_found
            if [ "$STATUS" = 1 ]; then
              echo
              echo "### Critical findings"
              echo
              echo '```'
              awk '/^CRITICAL/{c=1;next} /^WARNING/{c=0} c' "$RUNNER_TEMP/gates.txt" | head -60
              echo '```'
            fi
            if [ "$STATUS" != 0 ] && [ "$STATUS" != 1 ] && [ "$STATUS" != 2 ]; then
              echo "### Validator output (execution failure)"
              echo
              echo '```'
              tail -40 "$RUNNER_TEMP/gates.txt"
              echo '```'
            fi
            echo
            echo "### Publishing continued"
            echo
            echo "Report-only observation period: the gates did not block this run, and every"
            echo "commit, push and deployment step after this one ran as it otherwise would."
            echo "Review on or after **2026-10-12**."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          echo "sweets_checker_down=${SWEETS_DOWN}" >> "$GITHUB_OUTPUT"

          if [ "$SWEETS_DOWN" = yes ]; then
            echo "::warning title=Gate 10 checker unavailable::cw_sweet_guard failed to load. CW sweet-treat content was not checked on this run."
          fi

          # Warn and record a failed outcome only for criticals and for a validator
          # that did not run normally. Status 2 is warnings-only and stays quiet:
          # the repo carries standing warnings this workflow never touches, and a
          # daily annotation for them would bury the signal.
          case "$STATUS" in
            0|2) : ;;
            1)   echo "::warning title=Validation gates: critical findings::Exit 1. Publishing continued (report-only). See the job summary."; exit 1 ;;
            *)   echo "::warning title=Validation gates did not run::Unexpected exit ${STATUS}. Treated as a failure, not a pass. See the job summary."; exit "$STATUS" ;;
          esac

      - name: Deploy KD to ketodial repo
        if: steps.publish_kd.outputs.has_changes == 'true'
        env:
          KD_DEPLOY_TOKEN: ${{ secrets.KD_DEPLOY_TOKEN }}
        run: |
          cd ketodial/public
          git remote set-url origin https://x-access-token:${KD_DEPLOY_TOKEN}@github.com/MikeBrew123/ketodial.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: publish KD blog posts for $(date +%Y-%m-%d)"
          # The submodule checkout is a detached HEAD, so "git push origin main"
          # pushes the stale local main ref and reports "Everything up-to-date"
          # while the new commit never leaves the runner — which orphaned the
          # 2026-08-03 pointer and broke the next day's checkout. Push HEAD.
          git push origin HEAD:main

      # Pushes with the KD_DEPLOY_TOKEN PAT that actions/checkout persisted (not
      # GITHUB_TOKEN), so the push DOES fire push-triggered workflows such as
      # pescodial-deploy.yml. A push used to be "git push || true", which
      # dropped a failed push without a trace (posts flipped on the runner
      # only). Now: rebase-and-retry, and open an issue if it still fails.
      - name: Commit and push if changes
        id: commit
        if: steps.publish_cw.outputs.has_changes == 'true' || steps.publish_kd.outputs.has_changes == 'true' || steps.publish_pd.outputs.has_changes == 'true' || steps.ledger.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: publish scheduled blog posts for $(date +%Y-%m-%d)"
          PUSHED=false
          for attempt in 1 2 3; do
            if git push; then PUSHED=true; break; fi
            echo "Push attempt $attempt failed; rebasing on origin/main"
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep 5
          done
          echo "pushed=$PUSHED" >> $GITHUB_OUTPUT
          if [ "$PUSHED" != true ]; then
            echo "::error title=Publish push failed::The daily publish commit never reached main. Posts flipped on the runner only."
            TITLE="🚨 Daily publish push failed"
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
            if [ -z "$EXISTING" ]; then
              gh issue create --title "$TITLE" --body "git push from daily-publish failed 3 times on $(date -u +%F). Nothing published today reached main (statuses stay ready and retry tomorrow). Run: $RUN_URL" || true
            else
              gh issue comment "$EXISTING" --body "Failed again on $(date -u +%F): $RUN_URL" || true
            fi
          fi

      # Belt and braces for PescoDial. The push above already triggers
      # pescodial-deploy.yml (PAT push, data/blog_posts.json path filter), but
      # that silently stops if anyone switches the checkout back to
      # GITHUB_TOKEN or narrows the path filter. An explicit dispatch is
      # allowed from GITHUB_TOKEN (needs actions: write). A duplicate run just
      # queues in the pescodial-pages concurrency group and redeploys the same
      # commit. Dispatch rather than deploy inline so every PD deploy goes
      # through the same tests, render guard, e2e and liveness checks.
      - name: Trigger PescoDial deploy
        if: steps.publish_pd.outputs.has_changes == 'true' && steps.commit.outputs.pushed == 'true'
        # Red step, green job: a failed dispatch must not skip the CW Pages
        # deploy job or the indexing steps below. The issue is the alarm.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow run pescodial-deploy.yml --ref main; then
            TITLE="🚨 PescoDial deploy dispatch failed"
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
            if [ -z "$EXISTING" ]; then
              gh issue create --title "$TITLE" --body "gh workflow run pescodial-deploy.yml failed on $(date -u +%F) after publishing PD posts. Check that pescodial-deploy.yml ran from the push; if not, run it by hand. Run: $RUN_URL" || true
            else
              gh issue comment "$EXISTING" --body "Failed again on $(date -u +%F): $RUN_URL" || true
            fi
            exit 1
          fi
          echo "Dispatched pescodial-deploy.yml for:"
          echo "${{ steps.publish_pd.outputs.new_post_urls }}"

      - name: Submit CW posts to Google Indexing API
        if: steps.publish_cw.outputs.has_changes == 'true' && steps.publish_cw.outputs.new_post_urls != ''
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > dashboard/ga4-credentials.json
          cd dashboard && npm install --silent
          URLS="${{ steps.publish_cw.outputs.new_post_urls }}"
          node gsc-request-indexing.js $URLS

      - name: Submit CW posts to Bing via IndexNow
        if: steps.publish_cw.outputs.has_changes == 'true' && steps.publish_cw.outputs.new_post_urls != ''
        continue-on-error: true
        run: |
          URLS="${{ steps.publish_cw.outputs.new_post_urls }}"
          URL_LIST=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"carnivoreweekly.com\",
              \"key\": \"1d6e43b8829d44c28fbef02ee5b548d2\",
              \"keyLocation\": \"https://carnivoreweekly.com/1d6e43b8829d44c28fbef02ee5b548d2.txt\",
              \"urlList\": $URL_LIST
            }"
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') CW URLs to IndexNow"

      - name: Submit KD posts to Google Indexing API
        if: steps.publish_kd.outputs.has_changes == 'true' && steps.publish_kd.outputs.new_post_urls != ''
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > dashboard/ga4-credentials.json
          cd dashboard && npm install --silent
          node gsc-request-indexing.js --site kd

      - name: Submit KD posts to Bing via IndexNow
        if: steps.publish_kd.outputs.has_changes == 'true' && steps.publish_kd.outputs.new_post_urls != ''
        continue-on-error: true
        run: |
          URLS="${{ steps.publish_kd.outputs.new_post_urls }}"
          URL_LIST=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"ketodial.com\",
              \"key\": \"98237dd632e84e4e8743193ac2e1ee61\",
              \"keyLocation\": \"https://ketodial.com/98237dd632e84e4e8743193ac2e1ee61.txt\",
              \"urlList\": $URL_LIST
            }"
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') KD URLs to IndexNow"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main  # Ensure we get the latest commit including any just-pushed changes

      - name: Pull latest
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  health-check:
    needs: [publish, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # main, not the triggering SHA: the queue and drift checks must see
      # what the publish job just pushed, or a post published today still
      # reads as "ready" here.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check publish + deploy results
        run: |
          echo "=== Pipeline Health Check ==="
          echo "Publish: ${{ needs.publish.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"

      - name: Verify CW site is live
        continue-on-error: true
        run: |
          CW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://carnivoreweekly.com/blog/ || echo "000")
          echo "CW blog: $CW_STATUS"
          if [ "$CW_STATUS" != "200" ]; then
            echo "::warning::CW blog returned $CW_STATUS"
          fi

      - name: Verify KD site is live
        continue-on-error: true
        run: |
          KD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ketodial.com/blog/ || echo "000")
          echo "KD blog: $KD_STATUS"
          if [ "$KD_STATUS" != "200" ]; then
            echo "::warning::KD blog returned $KD_STATUS"
          fi

      # Per-guide liveness for PD lives in pescodial-deploy.yml (it runs after
      # the deploy); this is only the daily "is the site up" signal.
      - name: Verify PD site is live
        continue-on-error: true
        run: |
          PD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.pescodial.com/guides/ || echo "000")
          echo "PD guides: $PD_STATUS"
          if [ "$PD_STATUS" != "200" ]; then
            echo "::warning::PD guides returned $PD_STATUS"
          fi

      - name: Check queue health
        run: |
          python3 << 'PYEOF'
          import json
          from datetime import date

          with open("data/blog_posts.json") as f:
              data = json.load(f)
          posts = data.get("blog_posts", data) if isinstance(data, dict) else data

          # PD publishes 2 per rolling 7 days on purpose, so its gap allowance
          # is wider, and a site with no posts at all yet is reported, not warned.
          stale_after = {"cw": 5, "kd": 5, "pd": 8}
          for site in ("cw", "kd", "pd"):
              if not any(p.get("site") == site for p in posts):
                  print(f"{site.upper()}: no posts yet")
                  continue
              ready = [p for p in posts if p.get("site") == site and p.get("status") == "ready"]
              pub = sorted(
                  [p for p in posts if p.get("site") == site and p.get("status") == "published"],
                  key=lambda x: x.get("publish_date", ""), reverse=True
              )
              last = pub[0].get("publish_date", "never") if pub else "never"
              days = (date.today() - date.fromisoformat(last)).days if last != "never" else 999
              status = "OK" if len(ready) > 0 else "LOW"
              print(f"{site.upper()}: {len(ready)} ready, last published {last} ({days}d ago) [{status}]")
              if len(ready) == 0:
                  print(f"::warning::{site.upper()} queue is empty")
              if days > stale_after[site]:
                  print(f"::warning::{site.upper()} last publish was {days} days ago")
          PYEOF

      # A PD post still "ready" more than 8 days after its publish_date is
      # stuck: held by the 2-per-7-day cap behind an overfull queue, or a
      # publish that keeps failing. Report-and-issue only; never blocks CW/KD.
      - name: PD drift check (stuck ready posts)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STUCK=$(python3 scripts/pd_publish_check.py stuck --days 8)
          if [ -z "$STUCK" ]; then
            echo "PD drift: no stuck ready posts"
            exit 0
          fi
          echo "::warning title=PD posts stuck in ready::$(echo "$STUCK" | wc -l | tr -d ' ') post(s) more than 8 days past publish_date"
          echo "$STUCK"
          TITLE="⚠️ PescoDial posts stuck in ready"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf 'These pd posts in data/blog_posts.json are still status ready more than 8 days after their publish_date (slug, publish_date):\n\n```\n%s\n```\n\nLikely causes: the 2-per-7-day cap in scripts/daily_publish.py is holding an overfull queue (respace the dates), or the "Publish PD scheduled posts" step keeps failing (see the PD publish failure issue). Run: %s' "$STUCK" "$RUN_URL")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi

      - name: Open issue on failure
        if: needs.publish.result == 'failure' || needs.deploy.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const pubResult = '${{ needs.publish.result }}';
            const deployResult = '${{ needs.deploy.result }}';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'pipeline-failure', state: 'open',
            });
            if (existing.data.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Pipeline failure: publish=${pubResult}, deploy=${deployResult}`,
              labels: ['pipeline-failure'],
              body: `**Daily Pipeline Health Check**\n\n- Publish job: ${pubResult}\n- Deploy job: ${deployResult}\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck the run logs for details.\n\n---\n*Auto-generated by daily-publish.yml health-check*`,
            });

      # Resend quota alarm, second channel: a red run, so GitHub's failed-run
      # notification fires even if the issue is missed. It lives here, in the
      # last job, so the blog publish and the Pages deploy are never blocked.
      - name: Fail the run on Resend quota refusal
        if: needs.publish.outputs.resend_quota_refused == 'true'
        run: |
          echo "::error::Resend refused drip sends over its quota. Records: Supabase email_send_refusals. Details: the open 'Resend quota refused email sends' issue."
          exit 1

