name: Daily Blog Publisher

on:
  schedule:
    # Runs every day at 9:00 AM EST (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.KD_DEPLOY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml html5lib markdown jinja2 supabase python-dotenv requests

      - name: Send drip emails (7-Day Starter)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/send_drip.py

      - name: Publish CW scheduled posts
        id: publish_cw
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/daily_publish.py --site cw
          git add -A
          NEW_POSTS=$(git diff --staged --name-only | grep "^public/blog/.*\.html$" | grep -v "index.html" || true)
          if [ -n "$NEW_POSTS" ]; then
            URLS=$(echo "$NEW_POSTS" | sed 's|public/blog/|https://carnivoreweekly.com/blog/|')
            echo "new_post_urls<<EOF" >> $GITHUB_OUTPUT
            echo "$URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate KD post images
        continue-on-error: true
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/generate_post_images.py --site kd

      - name: Publish KD scheduled posts
        id: publish_kd
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/daily_publish.py --site kd
          python3 ketodial/scripts/generate_kd_blog.py --only-new
          git add -A
          NEW_POSTS=$(git diff --staged --name-only | grep "^ketodial/public/blog/.*\.html$" | grep -v "index.html" || true)
          if [ -n "$NEW_POSTS" ]; then
            KD_URLS=$(echo "$NEW_POSTS" | sed 's|ketodial/public/blog/|https://ketodial.com/blog/|')
            echo "new_post_urls<<EOF" >> $GITHUB_OUTPUT
            echo "$KD_URLS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy KD to ketodial repo
        if: steps.publish_kd.outputs.has_changes == 'true'
        env:
          KD_DEPLOY_TOKEN: ${{ secrets.KD_DEPLOY_TOKEN }}
        run: |
          cd ketodial/public
          git remote set-url origin https://x-access-token:${KD_DEPLOY_TOKEN}@github.com/MikeBrew123/ketodial.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: publish KD blog posts for $(date +%Y-%m-%d)"
          git push origin main

      - name: Commit and push if changes
        if: steps.publish_cw.outputs.has_changes == 'true' || steps.publish_kd.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: publish scheduled blog posts for $(date +%Y-%m-%d)"
          git push || true

      - name: Submit CW posts to Google Indexing API
        if: steps.publish_cw.outputs.has_changes == 'true' && steps.publish_cw.outputs.new_post_urls != ''
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > dashboard/ga4-credentials.json
          cd dashboard && npm install --silent
          URLS="${{ steps.publish_cw.outputs.new_post_urls }}"
          node gsc-request-indexing.js $URLS

      - name: Submit CW posts to Bing via IndexNow
        if: steps.publish_cw.outputs.has_changes == 'true' && steps.publish_cw.outputs.new_post_urls != ''
        continue-on-error: true
        run: |
          URLS="${{ steps.publish_cw.outputs.new_post_urls }}"
          URL_LIST=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"carnivoreweekly.com\",
              \"key\": \"1d6e43b8829d44c28fbef02ee5b548d2\",
              \"keyLocation\": \"https://carnivoreweekly.com/1d6e43b8829d44c28fbef02ee5b548d2.txt\",
              \"urlList\": $URL_LIST
            }"
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') CW URLs to IndexNow"

      - name: Submit KD posts to Google Indexing API
        if: steps.publish_kd.outputs.has_changes == 'true' && steps.publish_kd.outputs.new_post_urls != ''
        continue-on-error: true
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GA4_SERVICE_ACCOUNT_JSON" > dashboard/ga4-credentials.json
          cd dashboard && npm install --silent
          URLS="${{ steps.publish_kd.outputs.new_post_urls }}"
          node gsc-request-indexing.js $URLS

      - name: Submit KD posts to Bing via IndexNow
        if: steps.publish_kd.outputs.has_changes == 'true' && steps.publish_kd.outputs.new_post_urls != ''
        continue-on-error: true
        run: |
          URLS="${{ steps.publish_kd.outputs.new_post_urls }}"
          URL_LIST=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          curl -s -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"ketodial.com\",
              \"key\": \"98237dd632e84e4e8743193ac2e1ee61\",
              \"keyLocation\": \"https://ketodial.com/98237dd632e84e4e8743193ac2e1ee61.txt\",
              \"urlList\": $URL_LIST
            }"
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') KD URLs to IndexNow"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main  # Ensure we get the latest commit including any just-pushed changes

      - name: Pull latest
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  health-check:
    needs: [publish, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check publish + deploy results
        run: |
          echo "=== Pipeline Health Check ==="
          echo "Publish: ${{ needs.publish.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"

      - name: Verify CW site is live
        continue-on-error: true
        run: |
          CW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://carnivoreweekly.com/blog/ || echo "000")
          echo "CW blog: $CW_STATUS"
          if [ "$CW_STATUS" != "200" ]; then
            echo "::warning::CW blog returned $CW_STATUS"
          fi

      - name: Verify KD site is live
        continue-on-error: true
        run: |
          KD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ketodial.com/blog/ || echo "000")
          echo "KD blog: $KD_STATUS"
          if [ "$KD_STATUS" != "200" ]; then
            echo "::warning::KD blog returned $KD_STATUS"
          fi

      - name: Check queue health
        run: |
          python3 << 'PYEOF'
          import json
          from datetime import date

          with open("data/blog_posts.json") as f:
              data = json.load(f)
          posts = data.get("blog_posts", data) if isinstance(data, dict) else data

          for site in ("cw", "kd"):
              ready = [p for p in posts if p.get("site") == site and p.get("status") == "ready"]
              pub = sorted(
                  [p for p in posts if p.get("site") == site and p.get("status") == "published"],
                  key=lambda x: x.get("publish_date", ""), reverse=True
              )
              last = pub[0].get("publish_date", "never") if pub else "never"
              days = (date.today() - date.fromisoformat(last)).days if last != "never" else 999
              status = "OK" if len(ready) > 0 else "LOW"
              print(f"{site.upper()}: {len(ready)} ready, last published {last} ({days}d ago) [{status}]")
              if len(ready) == 0:
                  print(f"::warning::{site.upper()} queue is empty")
              if days > 5:
                  print(f"::warning::{site.upper()} last publish was {days} days ago")
          PYEOF

      - name: Open issue on failure
        if: needs.publish.result == 'failure' || needs.deploy.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const pubResult = '${{ needs.publish.result }}';
            const deployResult = '${{ needs.deploy.result }}';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'pipeline-failure', state: 'open',
            });
            if (existing.data.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Pipeline failure: publish=${pubResult}, deploy=${deployResult}`,
              labels: ['pipeline-failure'],
              body: `**Daily Pipeline Health Check**\n\n- Publish job: ${pubResult}\n- Deploy job: ${deployResult}\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck the run logs for details.\n\n---\n*Auto-generated by daily-publish.yml health-check*`,
            });

