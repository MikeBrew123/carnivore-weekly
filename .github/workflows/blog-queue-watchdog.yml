name: Blog Queue Watchdog

# Catches the silent-failure pattern where the blog stops publishing because
# the writer-swarm pipeline hasn't been triggered in days.
#
# Runs every Monday + Thursday at 13:00 UTC (after the daily-publish cron).
# Opens a GitHub Issue if the most recent published post is >5 days old,
# so we get a notification before the gap grows.

on:
  schedule:
    - cron: '0 13 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for stale blog queue
        id: check
        run: |
          LATEST=$(python3 -c "
          import json
          from datetime import date
          with open('data/blog_posts.json') as f:
              bp = json.load(f)
          published = [p for p in bp['blog_posts'] if p.get('status') == 'published' or p.get('published')]
          dates = sorted([p.get('publish_date', '') for p in published if p.get('publish_date')])
          today = date.today().isoformat()
          past = [d for d in dates if d <= today]
          print(past[-1] if past else '0000-00-00')
          ")
          DAYS_OLD=$(python3 -c "
          from datetime import date
          d = date.fromisoformat('$LATEST')
          print((date.today() - d).days)
          ")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "days_old=$DAYS_OLD" >> $GITHUB_OUTPUT
          echo "Latest published: $LATEST ($DAYS_OLD days ago)"
          if [ "$DAYS_OLD" -gt 5 ]; then
              echo "stale=true" >> $GITHUB_OUTPUT
          else
              echo "stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Open issue if queue is stale
        if: steps.check.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const latest = '${{ steps.check.outputs.latest }}';
            const daysOld = '${{ steps.check.outputs.days_old }}';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'blog-queue-stale',
              state: 'open',
            });
            if (existing.data.length > 0) {
              console.log(`Existing watchdog issue #${existing.data[0].number}, skipping`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Blog queue stale - last post ${daysOld} days ago (${latest})`,
              labels: ['blog-queue-stale'],
              body: `**Blog Queue Watchdog detected a silent failure.**\n\n- Latest published post: \`${latest}\`\n- Days since last publish: **${daysOld}**\n\n## Likely cause\n\n\`scripts/autonomous_blog_generation.sh\` is interactive (requires yes/no prompts), so it does not run unattended. When nobody triggers it manually, the queue goes dry. The daily publisher then runs successfully every day with nothing to publish, hiding the failure.\n\n## Recovery\n\nIn Claude Code: \"Generate 9 catch-up blog posts using Sarah, Marcus, Chloe from data/weekly_topics.json\". Backdate publish_date, run generate_blog_pages.py, commit + push, submit URLs via dashboard/gsc-request-indexing.js.\n\n## Permanent fix\n\nRefactor autonomous_blog_generation.sh to remove input() prompts.\n\n---\n*Auto-generated by .github/workflows/blog-queue-watchdog.yml*`,
            });
            console.log('Created stale-queue issue');

      - name: All clear
        if: steps.check.outputs.stale != 'true'
        run: echo "Queue healthy. Latest post ${{ steps.check.outputs.days_old }} days old."
