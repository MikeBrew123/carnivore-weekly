# Calculator guard (red-team step 2, 2026-08-30)
#
# Two protections for the revenue path:
#  1. Golden macro test — freezes the worker's calculateMacros behavior over
#     1,054 input cases. Any refactor that changes paid-report numbers fails
#     here instead of shipping. Intentional math changes regenerate
#     tests/macro_parity/golden.json with --update and the diff gets reviewed.
#  2. Bundle build check — the calculator2 bundle only ever built on one
#     laptop before this. This proves a clean clone still builds, so the page
#     is never one dead node_modules away from being unshippable.
#  3. Report suites (added 2026-09-08) — safety (medical gating), authoritative
#     intake (KetoDial: no paid report without a complete validated intake record)
#     and integrity
#     (the calendar and the shopping list must agree, and the list must be
#     DERIVED from the calendar). Both existed as files anyone could forget to
#     run; a customer found the divergence before we did. Now they gate.
name: calculator-guard

on:
  push:
    branches: [main]
    paths:
      - 'api/calculator-api.js'
      - 'api/medical-context.js'
      - 'calculator2-demo/**'
      - 'tests/macro_parity/**'
      - 'tests/report-safety.test.mjs'
      - 'tests/report-integrity.test.mjs'
      - 'ketodial/worker/index.js'
      - 'ketodial/worker/reports.js'
      - 'ketodial/worker/intake.js'
      - 'ketodial/worker/wrangler.toml'
      - 'tests/kd-report-safety.test.mjs'
      - 'tests/kd-intake-authority.test.mjs'
      - 'tests/deploy-tripwire.test.mjs'
      - 'tests/goal-conflict-flow.test.mjs'
      - 'tests/step4-state-updates.test.mjs'
      - 'api/goal-semantics.js'
      - 'api/wrangler.toml'
      - 'api/package.json'
      - '.github/workflows/calculator-guard.yml'
  pull_request:
    paths:
      - 'api/calculator-api.js'
      - 'api/medical-context.js'
      - 'calculator2-demo/**'
      - 'tests/macro_parity/**'
      - 'tests/report-safety.test.mjs'
      - 'tests/report-integrity.test.mjs'
      - 'tests/deploy-tripwire.test.mjs'
      - 'tests/goal-conflict-flow.test.mjs'
      - 'tests/step4-state-updates.test.mjs'
      - 'api/goal-semantics.js'
      - 'api/wrangler.toml'
      - 'api/package.json'
      - '.github/workflows/calculator-guard.yml'
      - 'ketodial/worker/index.js'
      - 'ketodial/worker/reports.js'
      - 'ketodial/worker/intake.js'
      - 'ketodial/worker/wrangler.toml'
      - 'tests/kd-report-safety.test.mjs'
      - 'tests/kd-intake-authority.test.mjs'
  workflow_dispatch:

jobs:
  golden-macros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Golden macro regression test
        run: node tests/macro_parity/golden_test.mjs

  report-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # kd-report-safety asserts against ketodial/public/index.html, which lives in
          # a submodule. Without this the INTAKE group fails for the wrong reason:
          # the file is simply absent, not wrong.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Medical gating of the paid report.
      - name: Report safety regression
        run: node tests/report-safety.test.mjs
      # The report must agree with itself: every protein the calendar tells the
      # reader to cook in week N is on week N's shopping list, in a quantity that
      # covers it, and the list is derived from the calendar rather than generated
      # beside it. See the header of that file for the customer report behind it.
      - name: KetoDial report safety regression
        run: node tests/kd-report-safety.test.mjs
      # A paid KetoDial report may only be written from a complete, validated,
      # authoritative intake record. Guards the storage contract itself: Stripe
      # metadata must never become the questionnaire store again, every
      # missing/malformed/incomplete/unreferenced intake must fail closed, and the
      # renal protein suppression must stay wired to the gate. Includes its own
      # mutation harness — a green run here is checked, not assumed.
      - name: KetoDial authoritative intake regression
        run: node tests/kd-intake-authority.test.mjs

      - name: Report integrity regression
        run: node tests/report-integrity.test.mjs
      # Exactly one file may be a deployed report generator. Two dormant ones exist
      # in api/ and neither is authorized for deletion, so this reads the actual
      # deployment surface (wrangler configs, package mains, CI) and fails the build
      # if either is ever promoted.
      - name: Deployment tripwire for dormant generators
        run: node tests/deploy-tripwire.test.mjs
      # The purchase flow: one shared conflict rule, and no path that can take
      # money while the customer's goal answers contradict each other.
      - name: Goal-conflict purchase-flow regression
        run: node tests/goal-conflict-flow.test.mjs

  bundle-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calculator2-demo/package-lock.json
      - name: Clean-clone build
        working-directory: calculator2-demo
        run: |
          npm ci
          npx vite build --outDir /tmp/calc2-ci-build --emptyOutDir
      - name: Client-vs-worker macro parity
        run: node tests/macro_parity/parity_test.mjs
      # Needs calculator2-demo/node_modules (react + esbuild), so it runs in this
      # job rather than the dependency-free one. Skips cleanly if they are absent.
      - name: Step 4 state-update regression
        run: node tests/step4-state-updates.test.mjs
      - name: Report bundle hash
        run: ls -la /tmp/calc2-ci-build/assets/
