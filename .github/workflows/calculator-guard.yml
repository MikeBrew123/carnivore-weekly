# Calculator guard (red-team step 2, 2026-08-30)
#
# Two protections for the revenue path:
#  1. Golden macro test — freezes the worker's calculateMacros behavior over
#     1,054 input cases. Any refactor that changes paid-report numbers fails
#     here instead of shipping. Intentional math changes regenerate
#     tests/macro_parity/golden.json with --update and the diff gets reviewed.
#  2. Bundle build check — the calculator2 bundle only ever built on one
#     laptop before this. This proves a clean clone still builds, so the page
#     is never one dead node_modules away from being unshippable.
#  3. Report suites (added 2026-09-08) — safety (medical gating), authoritative
#     intake (KetoDial: no paid report without a complete validated intake record)
#     and integrity
#     (the calendar and the shopping list must agree, and the list must be
#     DERIVED from the calendar). Both existed as files anyone could forget to
#     run; a customer found the divergence before we did. Now they gate.
name: calculator-guard

on:
  push:
    branches: [main]
    paths:
      - 'api/calculator-api.js'
      - 'api/medical-context.js'
      - 'calculator2-demo/**'
      - 'tests/macro_parity/**'
      - 'tests/report-safety.test.mjs'
      - 'tests/health-context-flow.test.mjs'
      - 'tests/report-integrity.test.mjs'
      - 'ketodial/worker/index.js'
      - 'ketodial/worker/reports.js'
      - 'ketodial/worker/intake.js'
      - 'ketodial/worker/wrangler.toml'
      # The submodule GITLINK. ketodial/public is the live intake UI: the kidney
      # safety question, and the option value= attributes that are an API contract
      # with calculator_sessions_v2. A pointer bump changes what real customers
      # submit, so it has to run the KD safety suite like any other source change.
      - 'ketodial/public'
      # The schema the safety code depends on. GROUP P mutation-tests this file —
      # a backfill added here would give every legacy customer a kidney answer
      # nobody gave — but a migration-only edit would not have triggered the guard
      # at all, so none of those tests would have run. Same hole as the submodule
      # gitlink and the pull_request paths before it, for the third time.
      - 'supabase/migrations/20260908_kd_audit2b_kidney_status_and_delivery_marker.sql'
      - 'supabase/migrations/20260909_kd_audit2b_resume_token.sql'
      - 'tests/kd-report-safety.test.mjs'
      - 'tests/kd-intake-authority.test.mjs'
      - 'tests/kd-upgrade-offer.test.mjs'
      - 'tests/kd-plan-email.test.mjs'
      - 'tests/kd-schema-contract.test.mjs'
      - 'tests/support/pg-schema-harness.mjs'
      - 'supabase/migrations/**'
      - 'tests/deploy-tripwire.test.mjs'
      - 'tests/goal-conflict-flow.test.mjs'
      - 'tests/step4-state-updates.test.mjs'
      - 'api/goal-semantics.js'
      - 'api/wrangler.toml'
      - 'api/package.json'
      - '.github/workflows/calculator-guard.yml'
  pull_request:
    paths:
      - 'api/calculator-api.js'
      - 'api/medical-context.js'
      - 'calculator2-demo/**'
      - 'tests/macro_parity/**'
      - 'tests/report-safety.test.mjs'
      - 'tests/health-context-flow.test.mjs'
      - 'tests/report-integrity.test.mjs'
      - 'tests/deploy-tripwire.test.mjs'
      - 'tests/goal-conflict-flow.test.mjs'
      - 'tests/step4-state-updates.test.mjs'
      - 'api/goal-semantics.js'
      - 'api/wrangler.toml'
      - 'api/package.json'
      - '.github/workflows/calculator-guard.yml'
      - 'ketodial/worker/index.js'
      - 'ketodial/worker/reports.js'
      - 'ketodial/worker/intake.js'
      - 'ketodial/worker/wrangler.toml'
      # The submodule GITLINK. ketodial/public is the live intake UI: the kidney
      # safety question, and the option value= attributes that are an API contract
      # with calculator_sessions_v2. A pointer bump changes what real customers
      # submit, so it has to run the KD safety suite like any other source change.
      - 'ketodial/public'
      # The schema the safety code depends on. GROUP P mutation-tests this file —
      # a backfill added here would give every legacy customer a kidney answer
      # nobody gave — but a migration-only edit would not have triggered the guard
      # at all, so none of those tests would have run. Same hole as the submodule
      # gitlink and the pull_request paths before it, for the third time.
      - 'supabase/migrations/20260908_kd_audit2b_kidney_status_and_delivery_marker.sql'
      - 'supabase/migrations/20260909_kd_audit2b_resume_token.sql'
      - 'tests/kd-report-safety.test.mjs'
      - 'tests/kd-intake-authority.test.mjs'
      - 'tests/kd-upgrade-offer.test.mjs'
      - 'tests/kd-plan-email.test.mjs'
      - 'tests/kd-schema-contract.test.mjs'
      - 'tests/support/pg-schema-harness.mjs'
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  golden-macros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Golden macro regression test
        run: node tests/macro_parity/golden_test.mjs

  # THE SCHEMA CONTRACT. Runs the real worker against a real PostgreSQL instance
  # (PGlite, Postgres compiled to WebAssembly) whose schema is built from the
  # checked-in migration files, and asserts on rows Postgres actually accepted.
  #
  # It exists because on 2026-09-09 the Audit 2B deploy took the calculator down:
  # the client sends lifestyle_activity as a TDEE multiplier and the column accepts
  # five words. Two thousand passing assertions could not catch it, because every one
  # of them either mocked the database or compared the code against a JavaScript
  # restatement of the constraint, and a restatement cannot disagree with itself.
  #
  # Its own job because it is the only suite needing node_modules. No Docker, no
  # service container, and no production credentials.
  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json is gitignored in this repository, so `npm ci` cannot run
      # here. Install only the one dependency this suite needs, at the version
      # package.json pins, rather than the full devDependency set (which pulls
      # Playwright and a Chromium download for no benefit).
      - name: Install the schema-contract dependency
        run: npm install --no-audit --no-fund --no-save "@electric-sql/pglite@$(node -p "require('./package.json').devDependencies['@electric-sql/pglite']")"
      - name: KetoDial database schema contract
        run: node tests/kd-schema-contract.test.mjs

  report-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # kd-report-safety asserts against ketodial/public/index.html, which lives in
          # a submodule. Without this the INTAKE group fails for the wrong reason:
          # the file is simply absent, not wrong.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Medical gating of the paid report.
      - name: Report safety regression
        run: node tests/report-safety.test.mjs
      # The report must agree with itself: every protein the calendar tells the
      # reader to cook in week N is on week N's shopping list, in a quantity that
      # covers it, and the list is derived from the calendar rather than generated
      # beside it. See the header of that file for the customer report behind it.
      - name: KetoDial report safety regression
        run: node tests/kd-report-safety.test.mjs
      # A paid KetoDial report may only be written from a complete, validated,
      # authoritative intake record. Guards the storage contract itself: Stripe
      # metadata must never become the questionnaire store again, every
      # missing/malformed/incomplete/unreferenced intake must fail closed, and the
      # renal protein suppression must stay wired to the gate. Includes its own
      # mutation harness — a green run here is checked, not assumed.
      - name: KetoDial authoritative intake regression
        run: node tests/kd-intake-authority.test.mjs

      # The conversion pass of 2026-09-08 put a paid offer directly under the free
      # macro result. That card must derive what it sells from the SAME
      # productAvailable() the detailed picker uses — a hand-written product list
      # there would be a second copy of the renal rule, free to drift, and it would
      # advertise a Meal Plan the worker then declines at /checkout. This suite lifts
      # the real featuredOffer()/renderUpgradeCard() out of the shipped ketodial.js
      # and executes it, so it fails on behaviour rather than on wording.
      - name: KetoDial upgrade offer and result hierarchy
        run: node tests/kd-upgrade-offer.test.mjs

      # The free-results email is auto-sent seconds after the first result, so it is
      # the highest-volume surface KetoDial has. This suite drives the real
      # POST /email-plan and asserts on the exact payload Resend would receive:
      # subject, reply_to, tags and rendered HTML. It pins the renal suppression that
      # already shipped (no protein figure, no meal plan, no Full Protocol, and
      # "I'm not sure" never rendered as a diagnosis), the truthful fulfilment
      # wording, and that the buy link resumes the saved session instead of dropping
      # the reader back at an empty calculator.
      - name: KetoDial free-results email
        run: node tests/kd-plan-email.test.mjs

      - name: Report integrity regression
        run: node tests/report-integrity.test.mjs
      # The data-flow invariant behind the 2026-09-08 defect: any customer-entered
      # health field that can reach the AI prompt must also reach the safety
      # classifier. Walks the canonical field map rather than a keyword list, so a new
      # questionnaire field that is not wired into the gate fails here.
      - name: Health-context data-flow regression
        run: node tests/health-context-flow.test.mjs
      # Exactly one file may be a deployed report generator. Two dormant ones exist
      # in api/ and neither is authorized for deletion, so this reads the actual
      # deployment surface (wrangler configs, package mains, CI) and fails the build
      # if either is ever promoted.
      - name: Deployment tripwire for dormant generators
        run: node tests/deploy-tripwire.test.mjs
      # The purchase flow: one shared conflict rule, and no path that can take
      # money while the customer's goal answers contradict each other.
      - name: Goal-conflict purchase-flow regression
        run: node tests/goal-conflict-flow.test.mjs

  bundle-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: calculator2-demo/package-lock.json
      - name: Clean-clone build
        working-directory: calculator2-demo
        run: |
          npm ci
          npx vite build --outDir /tmp/calc2-ci-build --emptyOutDir
      - name: Client-vs-worker macro parity
        run: node tests/macro_parity/parity_test.mjs
      # Needs calculator2-demo/node_modules (react + esbuild), so it runs in this
      # job rather than the dependency-free one. Skips cleanly if they are absent.
      - name: Step 4 state-update regression
        run: node tests/step4-state-updates.test.mjs
      - name: Report bundle hash
        run: ls -la /tmp/calc2-ci-build/assets/
