name: Weekly Carnivore Site Refresh

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
    - cron: '0 0 * * 3'  # Every Wednesday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write  # Resend quota alarm opens an issue (scripts/resend_quota_alert.sh)

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests google-api-python-client jinja2 python-dotenv supabase markdown "pillow>=10.0.0"

      - name: Write .env
        run: |
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env

      - name: Decode GA4 credentials
        run: echo "${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}" | base64 -d > dashboard/ga4-credentials.json

      # ── DATA COLLECTION (non-fatal — errors logged, pipeline continues) ──
      # Note: Topic research + blog content generation lives in Claude Code
      # scheduled task "weekly-blog-content-generation" (Sun+Wed 8pm).
      # This workflow only handles homepage data refresh.

      - name: "Step 1: Collect YouTube data"
        continue-on-error: true
        run: python3 scripts/youtube_collector.py

      - name: "Step 2: Analyze content with Claude"
        continue-on-error: true
        run: python3 scripts/content_analyzer_optimized.py

      - name: "Step 3: Add sentiment analysis"
        continue-on-error: true
        run: python3 scripts/add_sentiment.py

      - name: "Step 3.5: Generate editorial commentary"
        continue-on-error: true
        run: python3 scripts/generate_commentary.py

      - name: "Step 3.6: Render CW blog pages"
        continue-on-error: true
        run: python3 scripts/generate_blog_pages.py --site cw

      - name: "Step 4: Generate Q&A"
        continue-on-error: true
        run: python3 scripts/answer_questions.py

      - name: "Step 4.5: Extract wiki keywords"
        continue-on-error: true
        run: python3 scripts/extract_wiki_keywords.py

      - name: "Step 4.6: Sync blog posts to Supabase"
        continue-on-error: true
        run: python3 scripts/sync_blog_posts_to_supabase.py

      # ── SITE GENERATION (fatal — build failures stop the pipeline) ──

      - name: "Step 5: Generate CW site pages"
        run: python3 scripts/generate.py --type all --site cw

      # ── NEWSLETTERS (Sunday only — generate + send CW and KD) ──

      - name: "Step 6: Generate and send weekly newsletters"
        id: newsletter
        if: github.event.schedule == '0 0 * * 0' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/weekly_newsletter.py --site both

      # Resend quota alarm (Brew, deck 920ebe5a, 2026-09-10). send_newsletter.py
      # (run as a subprocess above, which inherits GITHUB_OUTPUT) records each
      # quota refusal in Supabase email_send_refusals and sets this output.
      # weekly_newsletter.py never exits non-zero, so without this a refused
      # newsletter left the run green. Issue here; red run at the end of the job.
      - name: Alert on Resend quota refusal (newsletter)
        if: steps.newsletter.outputs.resend_quota_refused == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resend_quota_alert.sh "${{ runner.temp }}/resend-quota-refusals.md" newsletter

      # ── REPORTS (non-fatal) ──

      - name: Generate site report email
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: python3 scripts/generate_site_report.py

      # ── COMMIT & DEPLOY ──

      - name: Commit all changes
        run: |
          git config user.email "bot@carnivoreweekly.com"
          git config user.name "Carnivore Weekly Bot"
          # Legacy root copies (index.html, archive.html, channels.html, blog/)
          # were removed in ed69de3e — the site publishes from ./public only.
          # Keep them out of the staged list so the blog/blog/ mirror can't
          # silently come back if a script recreates them.
          git add data/ public/ images/ templates/ newsletters/ ketodial/ 2>/dev/null || true
          git diff --staged --quiet || (
            git commit -m "auto: weekly site refresh ($(date -u +'%Y-%m-%d'))"
            # Push race guard (Jul 5 2026 run lost its commit to a rejected push):
            # rebase onto whatever landed on main mid-run, preferring our fresh
            # generated files (-X theirs = the replayed commit during a rebase),
            # and retry up to 3 times.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "push attempt $i failed, retrying..." && sleep 10
            done
          )

      # Resend quota alarm, second channel: a red run, so GitHub's failed-run
      # notification fires even if the issue is missed. Last step, so the
      # commit and push above always happen first.
      - name: Fail the run on Resend quota refusal
        if: steps.newsletter.outputs.resend_quota_refused == 'true'
        run: |
          echo "::error::Resend refused newsletter sends over its quota. Records: Supabase email_send_refusals. Details: the open 'Resend quota refused email sends' issue."
          exit 1
