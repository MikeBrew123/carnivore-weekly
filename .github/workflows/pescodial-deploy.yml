name: Deploy PescoDial

# pescodial.com is served by Cloudflare Pages (project "pescodial"), not GitHub
# Pages, so it gets real 301s via _redirects. The site is rendered from
# templates + data/blog_posts.json on every deploy; output is never hand-edited.

on:
  push:
    branches: [main]
    paths:
      - 'pescodial/**'
      - 'data/blog_posts.json'
      - 'calculator2-demo/src/lib/calculations.ts'
      - 'tests/pd-*.test.mjs'
      - 'scripts/pd_publish_check.py'
      - '.github/workflows/pescodial-deploy.yml'
  workflow_dispatch:

# issues: write lets the liveness check open an issue instead of failing quietly.
permissions:
  contents: read
  issues: write

concurrency:
  group: pescodial-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Jinja2
        run: pip install jinja2

      - name: Isolation and cadence tests
        run: python3 tests/test_pd_site_isolation.py

      - name: Render site (fails on broken links or foreign posts)
        run: python3 pescodial/scripts/generate_pd_site.py

      - name: Calculator bundle matches the worker (shared engine)
        run: node tests/pd-macros-bundle.test.mjs

      - name: Calculator end to end (real browser, sign-up intercepted)
        run: |
          npm install --no-audit --no-fund --no-save playwright@$(node -p "require('./package.json').devDependencies.playwright || 'latest'")
          npx playwright install --with-deps chromium
          node tests/pd-calculator-e2e.test.mjs
          node tests/pd-analytics.test.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy pescodial/public --project-name pescodial --branch main --commit-dirty=true

      - name: Liveness check
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" https://pescodial.pages.dev/)
          echo "pescodial.pages.dev -> $code"
          test "$code" = "200"

      # Every published pd guide must answer 200 on the real domain and be in
      # the live sitemap. Retries ride out Cloudflare propagation (~2 min).
      # A cache-busting query keeps an edge-cached 404 from a pre-publish
      # probe out of the result (Pages serves the file regardless of query).
      - name: Guide liveness (every published PD post)
        run: |
          URLS=$(python3 scripts/pd_publish_check.py published-urls)
          if [ -z "$URLS" ]; then
            echo "No published PD guides yet; nothing to check."
            exit 0
          fi
          BUST="v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          FAILED=""
          for url in $URLS; do
            code=000
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "${url}?${BUST}-${i}" || echo 000)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$url -> $code"
            [ "$code" = "200" ] || FAILED="${FAILED}${url} returned ${code}"$'\n'
          done
          SITEMAP=""
          for i in $(seq 1 12); do
            SITEMAP=$(curl -s "https://www.pescodial.com/sitemap.xml?${BUST}-${i}" || true)
            MISSING=""
            for url in $URLS; do
              grep -qF "<loc>${url}</loc>" <<<"$SITEMAP" || MISSING="${MISSING}${url} "
            done
            [ -z "$MISSING" ] && break
            sleep 10
          done
          for url in $MISSING; do
            FAILED="${FAILED}${url} missing from sitemap.xml"$'\n'
          done
          if [ -n "$FAILED" ]; then
            printf '%s' "$FAILED" > "$RUNNER_TEMP/pd-liveness.txt"
            echo "::error title=PD guide liveness failed::$(printf '%s' "$FAILED" | wc -l | tr -d ' ') problem(s)"
            printf '%s' "$FAILED"
            exit 1
          fi
          echo "All $(echo "$URLS" | wc -l | tr -d ' ') published PD guides are live and in the sitemap."

      - name: Open issue on PD deploy or liveness failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 PescoDial deploy or guide liveness failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DETAIL=$(cat "$RUNNER_TEMP/pd-liveness.txt" 2>/dev/null || echo "A step before the guide liveness check failed; see the run log.")
          BODY=$(printf 'pescodial-deploy.yml failed on %s (event: %s, commit %s).\n\n```\n%s\n```\n\nRun: %s' "$(date -u +%F)" "${{ github.event_name }}" "${GITHUB_SHA}" "$DETAIL" "$RUN_URL")
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi
